id: direct-messenger
title: Личные сообщения
difficulty: 2
architecture_types:
  - chat
  - queues
duration_min: 40
canvas: blank
prompt_public: |
  Спроектируйте обмен сообщениями один-на-один: доставка в реальном времени, история, офлайн-получатели и базовые статусы.
hidden:
  functional:
    - "Отправлять текстовое сообщение одному собеседнику"
    - "Получать историю с cursor pagination"
    - "Показывать sent, delivered и read"
    - "Доставлять после reconnect без дублей"
    - "Удалять сообщение у себя и у всех в течение окна"
  nonfunctional:
    - "p99 send ack менее 150 мс"
    - "Online доставка p95 менее 500 мс"
    - "Доступность отправки 99.99%"
    - "Сообщение не теряется после accepted ack"
    - "Порядок стабилен внутри диалога"
  scale:
    - "30 млн DAU"
    - "Пик 250k сообщений/с"
    - "Среднее сообщение 1 КБ"
