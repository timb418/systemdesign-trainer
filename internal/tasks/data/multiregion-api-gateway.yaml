id: multiregion-api-gateway
title: Мультирегиональный API Gateway
difficulty: 3
architecture_types:
  - api_gateway
  - rate_limiter
  - distributed_cache
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте API Gateway для глобального SaaS-продукта, работающего в нескольких регионах.
  Пользователь должен попадать в подходящий регион; детали доступности и политик уточните.
hidden:
  functional:
    - "Маршрутизировать клиента в ближайший разрешённый регион с учётом residency tenant"
    - "Аутентифицировать запрос, применять tenant-specific quotas и политики доступа"
    - "Поддержать canary-маршрутизацию и мгновенный откат версии backend"
    - "Автоматически выводить регион из маршрутизации и переключать допустимый трафик"
    - "Вести глобальный аудит административных изменений конфигурации"
  nonfunctional:
    - "Доступность входного слоя 99.99%, RTO региона < 5 минут"
    - "Дополнительная задержка gateway p99 < 25 мс, не считая межрегионального пути"
    - "Новая deny-политика распространяется глобально за 15 секунд, обычный маршрут — за 60 секунд"
    - "Tenant с требованием EU residency никогда не маршрутизируется и не логируется вне EU"
    - "Глобальная квота не должна превышаться более чем на 5% во время нормальной работы"
  scale:
    - "12 регионов, 30 тыс. tenant и 120 тыс. маршрутов после раскрытия tenant-шаблонов"
    - "Средняя нагрузка 180 тыс. RPS, глобальный пик 600 тыс. RPS"
    - "Крупнейший tenant создаёт пик 45 тыс. RPS с глобальной квотой 50 тыс. RPS"
    - "Обновляется до 200 конфигурационных объектов в секунду; полный snapshot занимает 1,5 ГБ"
    - "Межрегиональный RTT составляет 40–220 мс; 85% запросов должны обслуживаться без межрегионального вызова"
