preferred_solution:
  narrative: |
    Anycast IP или latency-based DNS приводит клиента к ближайшей точке присутствия, где
    региональный L4-балансировщик распределяет запросы между stateless gateway. До выбора
    backend шлюз извлекает tenant из проверенного issuer или API-ключа, а не из произвольного
    заголовка. Локальная таблица residency задаёт множество разрешённых регионов. Если ближайший
    регион запрещён, запрос направляется в ближайший допустимый через управляемый private
    backbone; EU-tenant никогда не покидает европейский контур, включая access logs и traces.

    Data plane не обращается к глобальному control plane на каждом запросе. Он держит локальный
    immutable snapshot маршрутов, публичных ключей, политик и версий backend. Control plane
    сохраняет изменения в транзакционном журнале с монотонной ревизией, валидирует ссылки,
    подписывает пакет и публикует дельты через региональные очереди. Новый процесс сначала
    загружает snapshot из объектного хранилища, затем применяет дельты после его ревизии.
    Переключение версии атомарно. Защитные deny-изменения идут по отдельному приоритетному
    каналу; короткий polling последней ревизии страхует потерянные уведомления. Canary задаётся
    детерминированным хешем tenant и user, поэтому один пользователь не прыгает между версиями,
    а откат — это новая ревизия веса.

    JWT проверяется локально по кэшированному JWKS, mTLS защищает вызовы backend, а gateway
    удаляет внешние служебные заголовки. Иерархический rate limiter выдаёт каждому региону
    часть глобального бюджета крупного tenant. Региональные token bucket принимают решения без
    WAN на горячем пути, а координатор перераспределяет неиспользованные квоты каждые несколько
    секунд. Малый резерв и ограниченный lease удерживают суммарное превышение в пределах 5%.
    При потере координатора регионы продолжают только до конца lease с консервативным бюджетом,
    предотвращая неограниченный oversubscription.

    Глобальный health service объединяет синтетические пробы, ошибки data plane и состояние
    backend. Регион исключается после нескольких независимых сигналов, чтобы единичная
    неисправная проба не вызвала массовый failover. Переключение допускается только в регионы,
    разрешённые residency и имеющие резерв capacity. Для stateful API gateway не обещает
    прозрачный retry POST: он маршрутизирует новый запрос, а идемпотентность обеспечивает
    backend по ключу. Возврат региона выполняется ступенчато с canary-трафиком, иначе холодные
    кэши создадут повторный отказ.

    Capacity планируется на потерю крупнейшего допустимого региона, экземпляры масштабируются
    по RPS, соединениям и CPU. Метрики включают latency и коды по region/route/tenant_tier,
    возраст конфигурации, расхождение ревизий, долю межрегиональных запросов, остаток quota
    lease, причины residency redirect и ход failover. Tenant ID допускается только в
    защищённом аудите, но не как высококардинальная метка. Сквозной trace помечает выбранный
    регион без токенов. Алерты разделяют отказ edge, устаревшую конфигурацию, исчерпание
    региональной ёмкости и нарушение квот; регулярные game day проверяют RTO и корректность
    residency до реального инцидента.
  tradeoffs:
    - "Anycast vs latency-based DNS: Anycast быстрее реагирует на сеть, DNS проще контролировать, но зависит от TTL и кэшей резолвера."
    - "Локальный snapshot vs синхронный control plane: snapshot сохраняет data plane при сбое управления ценой временно устаревшей конфигурации."
    - "Глобальный rate limit через WAN vs региональные leases: leases убирают WAN с горячего пути, но допускают ограниченное превышение."
    - "Active-active регионы vs домашний регион tenant: active-active снижает latency, домашний регион упрощает данные и residency."
    - "Автоматический failover vs ручное подтверждение: автоматический держит RTO, но требует защиты от ложного массового переключения."
    - "Полный snapshot vs дельты: snapshot проще проверить и восстановить, дельты быстрее распространяются, но требуют строгого порядка ревизий."
  diagram: diagrams/multiregion-api-gateway.gold.drawio
rubric_overrides:
  - "Кандидат должен поставить residency выше близости и доступности и распространить ограничение на логи и трассировки."
  - "Высокий балл требует data plane, независимого от control plane на каждом запросе, и стратегии snapshot плюс упорядоченные дельты."
  - "Оценивается механизм глобальной квоты без синхронного межрегионального вызова на горячем пути."
  - "Нужно объяснить безопасные критерии вывода региона, запас capacity и постепенный возврат трафика."
  - "Canary должен быть стабильным для пользователя или tenant и управляться версионированной конфигурацией."
