id: delayed-job-scheduler
title: Планировщик отложенных задач
difficulty: 3
architecture_types:
  - queues
  - key_value_store
duration_min: 55
canvas: blank
prompt_public: |
  Спроектируйте платформу, которая запускает задания в заданный момент времени.
  Клиент передаёт задачу и время запуска, воркеры исполняют её позже. Начните с вопросов к требованиям.
hidden:
  functional:
    - "Создание, отмена и перенос одноразового задания до начала исполнения"
    - "Периодические задания по cron с указанной временной зоной"
    - "Выдача готовых заданий воркерам с lease и повторными попытками"
    - "Dead-letter queue и просмотр истории попыток"
    - "Идемпотентный create по ключу клиента"
  nonfunctional:
    - "At-least-once исполнение; обработчик использует job_id для дедупликации"
    - "99.9% заданий попадают воркеру не позже чем через 2 секунды от due_at"
    - "Доступность управляющего API 99.95%"
    - "Потеря подтверждённого задания при отказе зоны недопустима"
    - "Перенос и отмена линеаризуемы относительно ещё не начатого задания"
  scale:
    - "300 млн активных заданий, горизонт планирования до одного года"
    - "Средний create 15k/с, пик 60k/с"
    - "Пик наступления срока 200k заданий/с в начале часа"
    - "Payload до 64 КБ, средний 1 КБ"
    - "20 региональных пулов воркеров и 90 дней истории"
