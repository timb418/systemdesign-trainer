preferred_solution:
  narrative: |
    API поддерживает POST /jobs с idempotency_key, PATCH /jobs/{id} для reschedule и DELETE для cancel. Запись Job содержит job_id, tenant_id, due_at UTC, timezone, cron_expression, payload_ref, state, generation и retry_policy. Транзакционный metadata store шардируется по hash(job_id), реплицируется между зонами quorum-записью и обеспечивает compare-and-swap по generation. Payload больше нескольких килобайт уходит в object storage, а запись хранит ссылку и checksum.

    Индекс времени строится отдельно: ближайшие минуты размещаются в распределённом timing wheel, дальние задания — в упорядоченных bucket-ах по часу и shard. Scanner каждой партиции владеет lease с fencing epoch, заранее загружает следующий bucket и переводит due job из SCHEDULED в ENQUEUED условной транзакцией. Затем transactional outbox публикует job_id в ready queue; relay можно повторять без создания нового логического запуска. Воркеры получают lease, heartbeat-ят долгую попытку и завершают её CAS-переходом. Ошибка создаёт retry с exponential backoff и jitter, исчерпание попыток ведёт в DLQ.

    Отмена или перенос увеличивает generation. Scanner и worker обязаны сверять поколение, поэтому старая запись timing wheel безопасно игнорируется. Для cron после успешной постановки текущего запуска вычисляется следующий due_at с явными правилами DST; пропущенные окна имеют политику skip или catch-up. При падении scanner другой узел получает lease и перечитывает bucket; at-least-once сохраняется, а exactly-once не обещается. Пики сглаживаются partition-ами ready queue, admission control и tenant quotas. Метрики включают schedule lag, due-to-enqueue p99, scan lag, bucket size, lease steals, retry/DLQ rate, clock skew и outbox age; audit log и trace по job_id объясняют каждое изменение состояния.
  tradeoffs:
    - "Timing wheel для близких сроков экономит CPU, но дальний горизонт требует отдельного durable-индекса."
    - "Шардирование по job_id упрощает изменения, но временной индекс приходится поддерживать асинхронно через outbox."
    - "At-least-once переживает сбои, но переносит дедупликацию в обработчики."
    - "Проверка generation оставляет устаревшие записи до уборки, зато отмена не требует дорогого поиска по wheel."
    - "Catch-up cron сохраняет запуски после простоя, но способен вызвать лавину; skip безопаснее для нагрузки."
  diagram: diagrams/delayed-job-scheduler.gold.drawio
rubric_overrides:
  - "Кандидат разделяет долговечное хранение задания, временной индекс и ready queue."
  - "Кандидат решает гонку cancel/reschedule со scanner через generation или эквивалентный fencing."
  - "Кандидат обсуждает clock skew, DST и всплеск заданий на границе часа."
  - "Наблюдаемость содержит schedule lag, а не только QPS API."
