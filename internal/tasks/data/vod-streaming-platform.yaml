id: vod-streaming-platform
title: Платформа потокового видео по запросу
difficulty: 4
architecture_types:
  - video
  - object_storage
  - distributed_cache
duration_min: 55
canvas: blank
prompt_public: |
  Спроектируйте платформу просмотра заранее подготовленного видео по запросу для глобальной аудитории. Сосредоточьтесь на playback path и масштабировании.
hidden:
  functional:
    - "Выдавать каталог и авторизованную playback session"
    - "Поддерживать adaptive bitrate HLS или DASH"
    - "Продолжать просмотр с позиции пользователя на другом устройстве"
    - "Защищать платный контент подписанными URL и DRM-лицензией"
    - "Собирать события старта, буферизации, качества и завершения"
  nonfunctional:
    - "Playback API p99 не более 200 мс"
    - "Video start time p95 не более 2 секунд при нормальной сети"
    - "Доступность playback control plane 99.99%"
    - "Сегменты должны обслуживаться при региональном отказе origin"
    - "Прогресс просмотра может отставать до 10 секунд, но не должен заметно откатываться"
  scale:
    - "100 млн MAU и 10 млн одновременных зрителей"
    - "Средний поток 5 Мбит/с, глобальный egress около 50 Тбит/с в пик"
    - "5 млн видео и 20 ПБ закодированных сегментов"
    - "Пик 200 тысяч созданий playback session в секунду"
    - "2 млн QoE-событий в секунду"
