preferred_solution:
  narrative: |
    Библиотека предоставляет Get(key), Put(key, value, ttl), Delete(key) и SnapshotStats. Базовая структура объединяет hash map для поиска за O(1) и двусвязный список порядка использования: успешный Get и обновление перемещают узел в голову, а вытеснение идёт с хвоста. Узел хранит ключ, immutable byte-значение, размер с учётом накладных расходов и expires_at. Put под блокировкой проверяет переполнение арифметики, заменяет существующий узел, затем последовательно вытесняет хвост, пока суммарный объём не входит в лимит. Значение больше лимита сразу отклоняется.

    Для заданной конкуренции одна mutex корректна, но 200 тысяч чтений в секунду делают перемещение каждого hit точкой contention. Практичное развитие — несколько независимых сегментов по hash ключа, каждый со своей map, списком, счётчиком байтов и долей бюджета. Это приближённый глобальный LRU: горячий сегмент может вытеснять раньше, зато операции масштабируются по ядрам. Get проверяет TTL под той же блокировкой, удаляет истёкший узел и считает miss. Фоновый sweeper опционально выбирает ограниченное число хвостовых или heap-кандидатов; корректность не зависит от него.

    Значения копируются при Put и, согласно контракту, копируются либо выдаются read-only при Get, чтобы вызывающий код не создавал гонку. Счётчики операций атомарны и не требуют общего lock. Поскольку это best-effort слой, журнал и восстановление не нужны: сервис должен переживать cold cache обращением к источнику. Наблюдаемость включает hit ratio, latency по операциям, lock wait, число и причины eviction, expired entries, bytes и распределение размеров. Алерт полезен при длительном падении hit ratio или частом отказе Put; профили CPU и mutex показывают, когда пора увеличивать сегментацию.
  tradeoffs:
    - "Один lock vs сегменты: единый lock даёт точный LRU, сегменты повышают throughput ценой приближённого порядка."
    - "Ленивый TTL vs фоновый sweeper: ленивое удаление просто, но истёкшие записи удерживают память."
    - "Копирование value vs read-only ссылка: копия безопаснее, ссылка экономит память и CPU."
    - "Лимит по числу элементов vs байтам: количество проще, байты реально защищают процесс от крупных значений."
  diagram: diagrams/lru-cache.gold.drawio
rubric_overrides:
  - "Должны присутствовать hash map и двусвязный список с O(1) операциями."
  - "Кандидат обязан учитывать размер ключей, значений и служебных структур."
  - "Оценивать явный контракт владения byte-значением при конкурентном доступе."
