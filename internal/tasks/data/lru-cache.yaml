id: lru-cache
title: LRU-кэш в одном процессе
difficulty: 1
architecture_types:
  - distributed_cache
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте многопоточный in-memory LRU-кэш для сервиса.
  Уточните контракт и ожидаемую нагрузку.
hidden:
  functional:
    - "Поддерживать Get, Put и Delete для строковых ключей и byte-значений"
    - "Вытеснять наименее недавно использованный элемент при исчерпании лимита байтов"
    - "Поддерживать TTL на запись и ленивое удаление истёкших данных"
    - "Возвращать статистику hit, miss, eviction и текущего объёма"
  nonfunctional:
    - "Get p99 < 1 мс без обращения к внешним системам"
    - "Операции потокобезопасны для 64 конкурентных потоков"
    - "Учёт памяти не должен превышать настроенный лимит более чем на 5%"
    - "Кэш является best-effort: после перезапуска прогрев с нуля допустим"
  scale:
    - "Лимит процесса 8 ГБ"
