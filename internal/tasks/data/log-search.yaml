id: log-search
title: Поиск по журналам приложений
difficulty: 3
architecture_types:
  - search
  - metrics
  - queues
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте сервис централизованного поиска по логам множества приложений. Инженеры должны находить события во время расследования инцидентов.
hidden:
  functional:
    - "Принимать структурированные и текстовые логи с метками сервиса, окружения и уровня"
    - "Искать по временному диапазону, словам, полям и trace_id"
    - "Показывать результаты по времени с безопасной пагинацией"
    - "Поддерживать разные сроки хранения для команд и уровней логов"
    - "Ограничивать доступ к логам по tenant и проекту"
  nonfunctional:
    - "Приём логов не блокирует приложения дольше 20 мс p99"
    - "Новые события доступны поиску не позднее 30 секунд p99"
    - "Поиск за последние 15 минут отвечает за 2 секунды p95"
    - "Доступность приёма 99.99%, поиска 99.9%"
    - "Система должна пережить шестичасовой отказ индексаторов и последующее отставание восстановления без потери подтверждённых событий"
  scale:
    - "500 тысяч событий в секунду в среднем и 2 млн в секунду в пик"
    - "Средний размер события 800 байт, около 35 ТБ сырого потока в сутки"
    - "Хранение hot 7 дней и archive 90 дней; durable log удерживает события минимум 24 часа"
    - "5 тысяч tenants и до 20 тысяч одновременных поисков"
    - "Один запрос охватывает в среднем 10 минут, максимум 30 дней"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "поле", "trace", "поиск", "пагинац", "retention", "хранени", "доступ"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "свежест", "потер", "отказ", "durability"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "eps", "нагрузк", "событ", "терабайт", "tenant", "масштаб", "пик", "дней"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Агенты на хостах и sidecar-контейнеры принимают stdout или OTLP, добавляют tenant, service и timestamp, пакетируют записи и отправляют их в региональные ingest gateways. Gateway аутентифицирует источник, проверяет лимиты, сжимает batch и подтверждает его только после записи в реплицированный журнал. При недоступности сети агент использует ограниченный disk spool и backpressure с приоритетом уровней, чтобы не блокировать приложение. События получают ingest_time и event_time; уникальный batch_id вместе с offset позволяет индексатору переживать повторы.

    Поток разделяется по tenant и временному bucket. Независимый raw sink сохраняет подтверждённые batches в object storage, не завися от доступности индексаторов. Indexer разбирает известные поля, строит инвертированный индекс для текста и колонночные структуры для меток. Горячие сегменты публикуются каждые несколько секунд, затем compactor объединяет их и формирует versioned manifest. Query API принимает временной диапазон, выражение фильтра и page_token, проверяет RBAC, выбирает только нужные shards по tenant/time и делает scatter-gather. Результаты сортируются парой event_time и event_id; непрозрачный token также фиксирует point-in-time manifest/searchable watermark, а его версия удерживается на срок пагинации, поэтому публикация новых сегментов не создаёт пропуски и повторы. Запросы по архиву читают дешёвые сегменты из object storage медленнее и имеют отдельную квоту.

    Журнал удерживает данные минимум 24 часа, оставляя запас после шестичасового сбоя на catch-up; индексаторы возобновляют offsets, а при превышении окна могут восстановиться из raw archive. Exactly-once не требуется, поскольку idempotent segment writer дедуплицирует batch. Неразбираемый лог сохраняется как raw и попадает в dead-letter метрику, а не теряется. Tenant quotas, ограничение диапазона и budget на скан защищают соседей. Наблюдаемость включает ingest lag, durable-log depth и time-to-expiry, dropped/spooled bytes, возраст searchable watermark, p95 запросов по диапазонам, scanned bytes, hot-shard skew и ошибки авторизации. Алерты отделяют угрозу потери данных от временного отставания поиска и требуют, чтобы прогноз catch-up завершался до истечения журнала.
  tradeoffs:
    - "Полная индексация payload ускоряет произвольный поиск, но резко увеличивает стоимость; индекс избранных полей дешевле."
    - "Подтверждение после durable log надёжнее, чем после памяти gateway, ценой небольшой дополнительной задержки."
    - "Шардирование по tenant изолирует клиентов, но крупный tenant создаёт hotspot; временные подшарды выравнивают его."
    - "Короткие сегменты улучшают свежесть, но создают write amplification и требуют compaction."
    - "Единый движок hot/archive проще, раздельные уровни хранения значительно снижают стоимость долгого retention."
    - "Point-in-time pagination требует удерживать старые manifests, зато сохраняет стабильный результат при публикации новых сегментов."
  diagram: diagrams/log-search.gold.drawio
rubric_overrides:
  - "Кандидат должен различать event time, ingest time и searchable watermark."
  - "Обязательно оценивать durability до индексации и восстановление после шестичасового отставания."
  - "Оценивать tenant isolation, квоты и ограничение дорогих широких запросов."
  - "Retention журнала должен покрывать отказ и catch-up; raw archive не должен зависеть от индексаторов."
  - "Безопасная пагинация должна фиксировать point-in-time manifest или searchable watermark."
