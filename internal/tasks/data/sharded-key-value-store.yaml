  - id: functional
    keywords: ["функционал", "api", "cas", "шард", "перенос", "реплик", "чтение"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["durability", "надёж", "latency", "доступн", "failover", "простой", "sla"]
    reveal: ["hidden.nonfunctional"]
