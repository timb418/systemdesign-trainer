id: sharded-key-value-store
title: Шардированное key-value хранилище
difficulty: 3
architecture_types:
  - key_value_store
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте горизонтально масштабируемое key-value хранилище внутри одного региона.
  Уточните гарантии и сценарии изменения состава кластера.
hidden:
  functional:
    - "Поддерживать Get, Put, Delete и Compare-And-Set для одного ключа"
    - "Автоматически разбивать keyspace и переносить диапазоны между узлами"
    - "Реплицировать каждый шард и выполнять автоматический failover"
    - "Предоставлять консистентное чтение по запросу клиента"
  nonfunctional:
    - "Подтверждённая запись не теряется при отказе одного узла"
    - "Доступность 99.99% при потере отдельного узла или стойки"
    - "Get p99 < 15 мс, Put p99 < 30 мс внутри региона"
    - "Перемещение шарда не должно останавливать операции дольше 2 секунд"
  scale:
    - "10 ПБ данных и 5 трлн ключей"
    - "Пик 3 млн Get/с и 800 тыс. Put/с"
    - "3000 storage-узлов в 6 тыс. шардов"
    - "Среднее значение 1.5 КБ, крупнейшее ограничено 1 МБ"
