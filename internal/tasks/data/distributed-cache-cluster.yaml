id: distributed-cache-cluster
title: Кластер распределённого кэша
difficulty: 3
architecture_types:
  - distributed_cache
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте общий cache-aside кластер для десятков сервисов.
  Определите контракт, размещение данных и поведение при сбоях.
hidden:
  functional:
    - "Поддерживать Get, Set с TTL, Delete и пакетные операции"
    - "Распределять ключи по узлам и автоматически добавлять или удалять ёмкость"
    - "Реплицировать горячие данные для переживания отказа узла"
    - "Защищать источник от cache stampede и отрицательно кэшировать отсутствие"
    - "Изолировать квоты разных клиентов"
  nonfunctional:
    - "Get p99 < 5 мс внутри региона при нормальной работе"
    - "Доступность чтения 99.99%, потеря кэшированных данных допустима"
    - "Перебалансировка не должна увеличивать miss rate более чем на 10 процентных пунктов"
    - "Один клиент не может занять более своей квоты памяти или QPS"
  scale:
    - "800 узлов по 128 ГБ RAM (около 102 ТБ raw capacity)"
    - "15 млн Get/с и 1 млн Set/с в пике"
    - "4 млрд активных ключей, среднее значение 8 КБ (около 32 ТБ logical payload до репликации и overhead)"
    - "80% запросов приходится на 5% ключей"
