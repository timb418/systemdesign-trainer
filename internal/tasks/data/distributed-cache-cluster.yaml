preferred_solution:
  narrative: |
    Клиентская библиотека знает версионированную карту виртуальных партиций от control plane и по hash(namespace, key) направляет запрос непосредственно владельцу. Отдельный proxy допустим для простых клиентов, но не должен становиться единственной точкой данных. Каждая партиция имеет primary и реплику на другом failure domain. Set получает монотонную версию primary, записывается локально и асинхронно передаётся реплике; поскольку кэш восстанавливаем, синхронная durability не нужна. Get обычно идёт primary, а при timeout — реплике, где более старая версия приемлема в пределах TTL.

    Узел хранит значения в slab-классах, чтобы ограничить фрагментацию, и ведёт eviction раздельно по namespace. Admission-фильтр TinyLFU не позволяет одноразовому scan вытеснить популярный набор, а внутри принятых данных используется сегментированный LRU. TTL проверяется на чтении и обслуживается timing wheel для фоновой очистки. Клиенты получают singleflight API или lease token на miss: только победитель читает источник, остальные коротко ждут либо используют stale value. Отсутствующие объекты кэшируются на малый TTL с ограничением размера negative cache.

    Control plane следит за membership, ёмкостью и квотами. При добавлении узла он назначает небольшую долю виртуальных партиций и переносит данные с ограничением bandwidth; старый владелец временно перенаправляет запросы по новой epoch. При внезапном отказе реплика повышается, а cold misses постепенно восстанавливают содержимое. Consistent hashing уменьшает движение, но явные виртуальные партиции упрощают управляемую балансировку при неодинаковых узлах. Наблюдаемость разбита по tenant и partition: hit ratio, p99, evictions, bytes, replication lag, redirects, hot keys, rejected quota и source load. Алерты ловят failover storm, рост miss rate и перекос памяти; sampled tracing связывает клиентский retry с выбранной epoch.
  tradeoffs:
    - "Client-side routing vs proxy: библиотека убирает hop, proxy упрощает обновление клиентов и контроль политики."
    - "Асинхронная vs синхронная репликация: async держит latency, но failover может вернуть miss или старое значение."
    - "Consistent hash ring vs фиксированные партиции: ring прост, партиции лучше переносятся и наблюдаются."
    - "LRU vs TinyLFU admission: чистый LRU понятен, admission лучше переживает сканирующий трафик."
    - "Serve stale vs строгий miss: stale защищает источник, но продлевает видимость устаревших данных."
  diagram: diagrams/distributed-cache-cluster.gold.drawio
rubric_overrides:
  - "Нужно отделить control plane membership от высоконагруженного data plane."
  - "Ожидается защита от stampede, а не только consistent hashing."
  - "Перебалансировка должна иметь epoch, ограничение скорости и переходный маршрут."
  - "Квоты и eviction необходимо изолировать по tenant."
