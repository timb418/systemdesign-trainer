id: single-node-key-value-store
title: Key-value хранилище на одном узле
difficulty: 1
architecture_types:
  - key_value_store
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте дисковое key-value хранилище на одном сервере.
  Согласуйте API и гарантии перед выбором структур данных.
hidden:
  functional:
    - "Поддерживать Put, Get и Delete для произвольных byte-ключей и значений"
    - "Переживать перезапуск без потери подтверждённых записей"
    - "Поддерживать batch атомарных изменений"
    - "Выполнять фоновую очистку удалённых и устаревших версий"
  nonfunctional:
    - "Подтверждённый Put не теряется после падения процесса или питания"
    - "Get p99 < 10 мс, Put p99 < 20 мс на NVMe"
    - "Контрольная сумма должна обнаруживать повреждённые записи"
    - "Доступность одного процесса важнее онлайн-ремонта: короткий recovery допустим"
  scale:
    - "До 500 млн ключей"
    - "2 ТБ полезных данных, среднее значение 2 КБ"
    - "Пик 30 тыс. Get/с и 10 тыс. Put/с"
    - "Рабочий набор индекса ограничен 32 ГБ RAM"
