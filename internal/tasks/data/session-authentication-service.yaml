id: session-authentication-service
title: Сервис сессионной аутентификации
difficulty: 1
architecture_types:
  - identity_auth
  - distributed_cache
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте сервис, который аутентифицирует пользователей веб-приложения и поддерживает их сессии.
  Опишите основные компоненты и поток запросов.
hidden:
  functional:
    - "Вход по email и паролю с выдачей серверной сессии"
    - "Проверка сессии внутренними сервисами на каждом защищённом запросе"
    - "Выход с текущего устройства и отзыв конкретной сессии"
    - "Просмотр и завершение всех активных сессий пользователя"
    - "Блокировка входа после серии неудачных попыток"
  nonfunctional:
    - "p99 проверки активной сессии < 20 мс внутри одного региона"
    - "Доступность проверки сессии 99.95%, входа — 99.9%"
    - "Пароли хранятся только как Argon2id-хеши с уникальной солью"
    - "Идентификатор сессии должен иметь не менее 128 бит энтропии и передаваться только в Secure HttpOnly SameSite cookie"
    - "Отзыв сессии должен начать действовать не позднее чем через 5 секунд"
  scale:
    - "2 млн зарегистрированных пользователей и 300 тыс. DAU"
    - "Одновременно активно до 120 тыс. сессий"
    - "Пик проверок сессии — 8 тыс. RPS, пик входов — 80 RPS"
    - "Средняя сессия живёт 7 дней, абсолютный срок — 30 дней"
    - "Одна запись сессии занимает около 500 байт; хранится до 5 сессий на пользователя"
