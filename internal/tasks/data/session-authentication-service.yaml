preferred_solution:
  narrative: |
    Внешний API содержит POST /sessions для входа, GET /sessions для списка устройств,
    DELETE /sessions/{id} для точечного отзыва и DELETE /sessions для выхода везде. На входе
    сервис нормализует email, проверяет IP/account rate limit и lock_until, читает учётную запись
    из PostgreSQL, проверяет Argon2id-хеш и только затем создаёт криптографически случайный
    идентификатор. Неудача атомарно увеличивает распределённый счётчик аккаунта; после порога
    короткая блокировка с ограниченным TTL фиксируется в PostgreSQL, а успешный вход сбрасывает
    счётчик. IP-лимит, CAPTCHA и уведомление владельца уменьшают риск намеренной блокировки чужого
    аккаунта. Клиент получает идентификатор сессии в cookie
    с атрибутами Secure, HttpOnly и SameSite=Lax; тело ответа не раскрывает токен. Все unsafe
    HTTP-методы требуют совпадения Origin/Referer и CSRF-токена, связанного с сессией; login и
    logout защищены теми же правилами. Ошибка входа
    одинакова для неизвестного email и неверного пароля, чтобы не позволять перебор аккаунтов.

    Запись сессии с user_id, временем создания, последней активностью, абсолютным и скользящим
    сроками хранится в Redis. Отдельный индекс пользователя содержит идентификаторы его сессий.
    PostgreSQL остаётся источником истины для аккаунта, статуса блокировки и аудита, но не
    участвует в каждом прикладном запросе. API Gateway передаёт cookie сервису проверки через
    внутренний GET /sessions/{token}; тот возвращает user_id и минимальный набор атрибутов.
    Результат нельзя долго кэшировать на gateway: короткий локальный кэш на 2 секунды допустим
    лишь вместе с максимальным окном отзыва 5 секунд. Продление TTL выполняется не на каждой
    проверке, а, например, раз в час, чтобы уменьшить поток записей.

    Redis развёрнут с репликой и автоматическим переключением. При потере primary уже
    подтверждённая запись сессии теоретически может исчезнуть, поэтому создание отвечает только
    после репликации хотя бы на один узел. Если Redis полностью недоступен, защищённые операции
    закрываются по принципу fail closed; публичные страницы продолжают работать, а новый вход
    временно возвращает 503. Для выхода удаляются сама запись и элемент пользовательского
    индекса. События входа, отказа, выхода и административной блокировки отправляются в журнал
    аудита через очередь; потеря аналитики не должна ломать основной поток.

    Ограничитель по IP и по account_id, временная блокировка и растущая задержка снижают
    credential stuffing, а одинаковый внешний ответ и фиктивная Argon2id-проверка для неизвестного
    email не раскрывают существование пользователя. Переход lock/unlock выполняется условной
    записью, поэтому параллельные попытки не обходят порог. Межсервисный вызов защищён mTLS,
    секрет cookie не попадает в логи. Наблюдаемость включает p50/p95/p99 проверки, долю
    Redis-miss, ошибки входа по причине, число активных сессий, лаг реплики, срабатывания
    лимитов и трассировку от gateway до сервиса. Алерты отделяют деградацию входа от критичной
    деградации проверки, потому что их влияние на пользователей различно.
  tradeoffs:
    - "Серверная сессия vs самодостаточный JWT: сессия даёт немедленный отзыв и простую смену прав ценой обращения к хранилищу."
    - "Redis vs SQL на каждой проверке: Redis держит низкий p99, но требует стратегии репликации и восстановления."
    - "Fail closed vs fail open при отказе Redis: закрытие безопаснее, но временно блокирует защищённые функции."
    - "Скользящий TTL на каждом запросе vs редкое продление: редкое продление уменьшает записи, но делает границу активности грубее."
    - "Локальный кэш gateway vs мгновенный отзыв: двухсекундный кэш снижает RPS ценой ограниченного окна устаревания."
    - "Жёсткая блокировка vs растущая задержка: задержка меньше помогает атакующему устроить блокировку чужого аккаунта."
  diagram: diagrams/session-authentication-service.gold.drawio
rubric_overrides:
  - "Кандидат обязан отделить хранение паролей от хранения сессий и назвать стойкое хеширование паролей."
  - "Высокий балл за явную семантику отзыва, TTL и поведение при недоступности сессионного хранилища."
  - "Нельзя считать решение безопасным, если токен передаётся без Secure/HttpOnly или пишется в логи."
  - "Оценивается различение частоты входа и значительно более частой проверки сессии."
