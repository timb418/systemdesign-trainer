preferred_solution:
  narrative: |
    Мобильный клиент после получения токена вызывает PUT /v1/users/{id}/devices/{device_id}; Device Registry хранит provider, token, platform, updated_at и активность, шифруя токен на диске. Продюсер отправляет POST /v1/notifications с user_id, title, body, data и idempotency key. API аутентифицирует сервис, проверяет размер payload, в транзакции создаёт notification и уникальную запись ключа, затем публикует идентификатор в durable queue через outbox. Ответ 202 означает принятие системой, а не доставку на телефон.

    Worker получает актуальные активные устройства пользователя, создаёт delivery на каждый токен и вызывает отдельные APNs/FCM adapters. Адаптеры управляют постоянными соединениями, ограничивают скорость по провайдеру и классифицируют ответы. Временные ошибки повторяются с exponential backoff и jitter до срока годности; постоянный ответ о неверном токене деактивирует устройство. Queue обеспечивает at-least-once, поэтому delivery_id используется как ключ дедупликации внутри системы. Провайдер может принять один повтор дважды, следовательно абсолютный exactly-once на экране телефона не обещается; collapse key можно применять для заменяемых сообщений.

    Очереди и worker pools разделены по провайдеру, поэтому остановка APNs не задерживает FCM. При длительном сбое backlog растёт, а просроченные сообщения переводятся в terminal status и DLQ. База статусов шардируется по notification_id при дальнейшем росте, Device Registry — по user_id. Наблюдаемость включает время API, outbox lag, queue age, attempts, provider latency и response codes, долю invalid tokens, success-to-provider и expired deliveries. Алерты работают отдельно по платформам; корреляционный notification_id связывает API, очередь и попытки. Выборочная сверка outbox с очередью обнаруживает потерявшиеся публикации до нарушения тридцатисекундного SLO.
  tradeoffs:
    - "Синхронный вызов APNs/FCM проще, очередь изолирует API от задержек и сбоев провайдера."
    - "Один токен на пользователя дешевле, реестр устройств корректно поддерживает несколько телефонов и переустановки."
    - "At-least-once сохраняет уведомления при сбоях, но требует идемпотентности и допускает редкие дубли у провайдера."
    - "Хранение полного статуса помогает поддержке, агрегированные метрики дешевле; короткий retention сочетает оба подхода."
  diagram: diagrams/basic-push-notifications.gold.drawio
rubric_overrides:
  - "Кандидат должен различать принятие сервисом, принятие push-провайдером и показ устройством."
  - "Оценивать жизненный цикл токена и обработку permanent provider errors."
  - "Принятие должно быть атомарно связано с durable outbox, а очереди и workers APNs/FCM изолированы."
