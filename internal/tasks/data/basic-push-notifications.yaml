id: basic-push-notifications
title: Базовые push-уведомления
difficulty: 1
architecture_types:
  - notifications
  - queues
duration_min: 30
canvas: blank
prompt_public: |
  Спроектируйте сервис, который отправляет push-уведомления пользователям мобильного приложения. Расскажите, какие вопросы зададите и как пойдёт доставка.
hidden:
  functional:
    - "Регистрировать и обновлять push-токены устройств"
    - "Принимать запрос на уведомление одному пользователю"
    - "Доставлять через APNs и FCM"
    - "Хранить статус принятия и последней попытки"
    - "Удалять недействительные токены по ответу провайдера"
  nonfunctional:
    - "API принимает запрос за 200 мс p99"
    - "99% уведомлений передаётся провайдеру за 30 секунд"
    - "Доступность приёма 99.9%"
    - "Повтор API с тем же idempotency key не создаёт новое логическое уведомление"
    - "Сбой одного провайдера не останавливает доставку через другой"
  scale:
    - "5 млн зарегистрированных пользователей"
    - "12 млн активных токенов устройств"
    - "50 млн уведомлений в сутки"
    - "Пик 5 тысяч запросов на отправку в секунду"
    - "Payload ограничен 4 КБ, история статусов хранится 7 дней"
