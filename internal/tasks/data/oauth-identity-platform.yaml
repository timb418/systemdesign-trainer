id: oauth-identity-platform
title: Мультитенантная OAuth-платформа идентификации
difficulty: 4
architecture_types:
  - identity_auth
  - api_gateway
  - key_value_store
duration_min: 60
canvas: blank
prompt_public: |
  Спроектируйте платформу идентификации, через которую сторонние приложения смогут входить от имени пользователей.
  Решение должно обслуживать несколько организаций; остальные требования уточните.
hidden:
  functional:
    - "Поддержать OAuth 2.1 Authorization Code с PKCE и OpenID Connect"
    - "Регистрировать клиентов, redirect URI, scopes и ключи отдельно для каждого tenant"
    - "Выдавать короткоживущие access token, ID token и ротируемые refresh token"
    - "Поддержать согласие пользователя, отзыв grant и глобальный выход"
    - "Публиковать OIDC discovery и JWKS, а также интроспекцию для opaque token"
    - "Федерация tenant с корпоративным SAML или внешним OIDC-провайдером"
  nonfunctional:
    - "Доступность token endpoint и проверки подписей 99.99%"
    - "p99 authorization endpoint < 300 мс без внешней федерации, token endpoint < 150 мс"
    - "Компрометация signing key одного tenant не должна затрагивать другие tenant"
    - "Повторное использование ротированного refresh token должно обнаруживаться и отзывать всю token family за 10 секунд"
    - "Изменения redirect URI и ключей клиента требуют аудита и вступают в силу не позднее чем за 60 секунд"
  scale:
    - "10 тыс. tenant, 250 тыс. OAuth-клиентов и 80 млн пользовательских идентичностей"
    - "Пик authorization endpoint — 12 тыс. RPS, token endpoint — 35 тыс. RPS"
    - "Проверка JWT ресурсными серверами достигает 1,5 млн RPS и не должна идти через центральный сервис"
    - "До 400 млн активных refresh token; средний access token живёт 10 минут"
    - "JWKS и discovery читаются до 100 тыс. RPS глобально; плановая ротация signing key каждые 30 дней"
reveal_on_question:
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "tenant", "клиент", "пользовател", "токен", "масштаб", "объём"]
    reveal: ["hidden.scale"]
  - id: functional
    keywords: ["flow", "grant", "функционал", "требования", "oauth", "oidc", "saml", "scope", "refresh", "интроспекц"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "безопас", "изоляц", "ключ", "ротац", "аудит"]
    reveal: ["hidden.nonfunctional"]
preferred_solution:
  narrative: |
    Платформа разделяет интерактивный authorization endpoint, token endpoint и плоскость
    управления tenant. Запрос GET /authorize сначала определяет tenant по issuer, загружает
    версионированную конфигурацию клиента из распределённого кэша и строго сопоставляет полный
    redirect_uri. Запрос обязан содержать непредсказуемый state, а OIDC-запрос — nonce; сервер
    возвращает state без изменения, клиент сравнивает его с локально сохранённым значением, а
    nonce затем проверяет в ID token. После локальной аутентификации либо федерации с SAML/OIDC
    создаётся одноразовый authorization code, привязанный к client_id, redirect_uri, scope,
    nonce и PKCE challenge. Code хранится в региональном KV не более минуты и атомарно потребляется
    POST /token. Это исключает повторный обмен и не требует передавать чувствительные данные
    через браузер.

    Token service повторно проверяет точный redirect_uri и PKCE. Public client не имеет секрета,
    а confidential client дополнительно аутентифицируется зарегистрированным private_key_jwt
    либо client_secret_basic; метод и credential жёстко привязаны к tenant_id и client_id,
    assertions одноразовы и ограничены по audience и времени. После проверки политики tenant и
    consent сервис подписывает ID token и
    короткий JWT access token ключом соответствующего tenant. Ресурсные серверы проверяют JWT
    локально по issuer, audience, expiry и scope, получая JWKS через CDN; центральная платформа
    не выдержала бы 1,5 млн синхронных проверок в секунду. Для сценариев, где нужен немедленный
    отзыв, клиент получает opaque access token и использует /introspect с коротким кэшем.
    Refresh token непрозрачен: в базе хранится только его хеш, family_id, predecessor и статус.
    Каждая ротация выполняется транзакционно. Повторное предъявление старого элемента помечает
    всю семью скомпрометированной и публикует событие отзыва.

    Метаданные tenant, клиенты, consent и token families размещаются в шардированной SQL-БД с
    tenant_id во всех ключах и проверках доступа. Client secrets хранятся только как стойкие
    хеши, имеют идентификатор версии и поддерживают перекрывающуюся ротацию; signing keys
    находятся в KMS/HSM. Приватный signing key не покидает модуль, а signing service получает ограниченный запрос
    на подпись. Для крупного tenant выделяется отдельный ключ и при необходимости шард.
    Ротация сначала публикует новый публичный ключ, затем начинает подпись, а старый ключ
    остаётся в JWKS дольше максимальной жизни токена. Конфигурационные изменения идут через
    журнал версий и инвалидацию кэшей.

    Authorization обрабатывается в домашнем регионе tenant, чтобы consent и одноразовые code
    имели строгую согласованность. Discovery и JWKS распространяются глобально и переживают
    отказ control plane. При потере региона маршрутизация переключает tenant на резерв после
    fencing старого писателя; краткая недоступность выдачи безопаснее двойного расходования
    code или refresh token. Внешняя федерация изолирована таймаутом и circuit breaker, поэтому
    сбой корпоративного IdP не истощает общие пулы.

    Метрики разбиваются по endpoint, региону и классу tenant без меток user_id: latency,
    error rate, code replay, refresh reuse, cache age JWKS, ошибки подписи, лаг репликации и
    федерации. Аудит неизменяемо фиксирует администратора, старое и новое значение настройки,
    а трассировка использует correlation_id без токенов и кодов. Алерты на аномальную выдачу,
    смену redirect URI и рост повторного использования refresh token дополняют rate limits,
    mTLS между сервисами и защиту публичных endpoint от автоматизированных атак.
  tradeoffs:
    - "JWT vs opaque access token: локальная проверка JWT масштабируется, opaque token обеспечивает более быстрый централизованный отзыв."
    - "Общий ключ vs ключ на tenant: отдельные ключи уменьшают радиус компрометации ценой нагрузки на HSM и большего JWKS."
    - "Домашний регион tenant vs active-active запись: домашний регион упрощает одноразовость code и refresh rotation, но повышает межрегиональную задержку."
    - "SQL vs распределённый KV для token families: SQL даёт транзакционную ротацию, KV легче масштабируется, но требует сложных conditional writes."
    - "Немедленная инвалидация кэша vs короткий TTL: события быстрее, однако TTL нужен как страховка от потерянной инвалидации."
    - "Failover доступности vs fencing безопасности: переключение без fencing быстрее, но допускает двух писателей и повторный расход секретов."
  diagram: diagrams/oauth-identity-platform.gold.drawio
rubric_overrides:
  - "Обязательно проверяются точное совпадение redirect URI, state, nonce и PKCE; одно упоминание OAuth без этих механизмов недостаточно."
  - "Кандидат должен развести локальную JWT-проверку и серверную интроспекцию, связав выбор с семантикой отзыва."
  - "Высокий балл требует корректной ротации refresh token с обнаружением повторного использования всей family."
  - "Оценивается изоляция tenant в данных, кэшах, ключах и метриках, а не только поле tenant_id."
  - "Нужно объяснить безопасную ротацию signing key и период одновременной публикации старого и нового ключей."
