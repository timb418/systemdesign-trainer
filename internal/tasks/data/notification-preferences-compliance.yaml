preferred_solution:
  narrative: |
    Write API принимает субъект, topic, channel, decision, legal_basis, jurisdiction, source и policy_version. Аутентифицированное изменение из приложения и подписанная unsubscribe-ссылка сходятся в одну идемпотентную команду. В транзакции сервис обновляет materialized current preference с монотонной revision и добавляет append-only consent event; outbox публикует invalidation. Unsubscribe token должен быть ограничен конкретным пользователем и темой, иметь срок и не раскрывать идентификатор в URL. Повторный переход по корректной ссылке безопасно возвращает уже применённую отписку: одноразовый отказ не должен мешать пользователю подтвердить состояние.

    Decision API принимает user_id, notification_class, topic, channel, region и timestamp. Policy Engine сначала определяет применимую версию правил юрисдикции, затем объединяет явное согласие, глобальную отписку, channel preference и узко заданное исключение для транзакционного сообщения. Ответ содержит allow/deny, revision, reason_code и policy_version, чтобы Notification Service мог сохранить доказательство решения. Горячий current state размещается в шардированном KV по user_id и кэшируется локально на секунды. Событие отписки немедленно обновляет KV и рассылает invalidation; дополнительно глобальный suppression set проверяется перед фактическим вызовом провайдера, закрывая уже стоящие в очередях сообщения.

    Для пакетной кампании API получает список идентификаторов или читает сегмент потоком и возвращает решения частями, не копируя контакты. При недоступности зависимости маркетинг работает fail-closed, тогда как строго разрешённые security-сообщения используют последнюю подписанную policy snapshot и отдельный аудит. Consent log реплицируется в WORM object storage, события связываются hash-chain и периодически заверяются контрольной суммой; исправление создаёт новое событие. Метрики включают decision latency, cache hit, propagation lag, deny reasons, fail-closed count, unsubscribe throughput, revision mismatch и целостность audit export. Алерт на пятитисекундный lag важнее общей средней задержки, а выборочная replay-проверка подтверждает совпадение materialized state с журналом.
  tradeoffs:
    - "Read-time вычисление гибко для новых правил, materialized decision быстрее, но требует инвалидации при изменении политики."
    - "Короткий кэш снижает нагрузку, suppression set на финальном шаге закрывает окно устаревшей отписки."
    - "Fail-closed защищает комплаенс маркетинга, но снижает доставляемость во время сбоя."
    - "Append-only журнал обеспечивает доказательство, current KV обеспечивает низкую задержку; нужны оба представления."
    - "Глобальная модель правил проще, versioned правила по юрисдикциям точнее и аудируемы, но сложнее тестируются."
    - "Одноразовый unsubscribe token уменьшает replay, но ухудшает повторную проверку пользователем; идемпотентный scoped token безопаснее для отписки."
  diagram: diagrams/notification-preferences-compliance.gold.drawio
rubric_overrides:
  - "Кандидат должен различать текущую проекцию предпочтений и долговечный аудит согласий."
  - "Отдельно оценивать закрытие гонки между отпиской и сообщением, уже находящимся в очереди."
  - "Маркетинговое решение при сбое обязано быть fail-closed; исключения должны быть узкими и аудируемыми."
