id: notification-preferences-compliance
title: Настройки уведомлений и комплаенс
difficulty: 2
architecture_types:
  - notifications
  - identity_auth
duration_min: 40
canvas: blank
prompt_public: |
  Спроектируйте сервис пользовательских настроек уведомлений, который проверяется перед отправкой маркетинговых и сервисных сообщений. Учтите юридические ограничения.
hidden:
  functional:
    - "Хранить согласия по теме, каналу, региону и юридическому основанию"
    - "Позволять пользователю подписываться и отписываться через приложение и unsubscribe-ссылку"
    - "Проверять право отправки пакетно и по одному получателю"
    - "Поддерживать обязательные транзакционные сообщения с ограниченными исключениями"
    - "Вести неизменяемый аудит источника и версии согласия"
  nonfunctional:
    - "Одиночная проверка p99 не более 30 мс"
    - "Отписка начинает блокировать новые отправки не позднее 5 секунд"
    - "Доступность проверки 99.99%"
    - "При неопределённом результате маркетинговая отправка запрещается"
    - "Аудит согласий хранится 7 лет и защищён от незаметного изменения"
  scale:
    - "100 млн пользователей"
    - "1 млрд проверок предпочтений в сутки и пик 50 тысяч в секунду"
