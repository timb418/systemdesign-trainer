id: video-upload-transcoding
title: Загрузка и транскодирование видео
difficulty: 3
architecture_types:
  - video
  - object_storage
  - queues
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте backend загрузки пользовательского видео и подготовки вариантов для просмотра на разных устройствах. Начните с контракта и потока данных.
hidden:
  functional:
    - "Создавать upload session и принимать возобновляемую загрузку"
    - "Проверять формат, длительность, вредоносный и запрещённый контент"
    - "Транскодировать в несколько разрешений и битрейтов"
    - "Генерировать manifest, thumbnails и публиковать готовность"
    - "Показывать владельцу прогресс и позволять безопасный повтор"
  nonfunctional:
    - "API управления p99 не более 300 мс"
    - "Видео длительностью 10 минут готово в течение 15 минут p95 после загрузки"
    - "Подтверждённые исходники не теряются, durability не ниже 99.999999999%"
    - "Повтор любого шага не создаёт противоречивые варианты"
    - "Повреждённый или запрещённый файл не публикуется"
  scale:
    - "2 млн загрузок в сутки"
    - "Средний исходник 500 МБ, около 1 ПБ входящих данных в сутки"
    - "Пик 10 тысяч одновременных загрузок"
    - "В среднем создаётся 5 вариантов общим размером 700 МБ"
    - "До 100 тысяч параллельных задач транскодирования"
