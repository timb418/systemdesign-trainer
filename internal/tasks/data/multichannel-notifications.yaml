preferred_solution:
  narrative: |
    Producer API принимает notification_type, recipient_id, template_version либо template alias, variables, allowed_channels, priority, schedule_at и idempotency key. После авторизации сервис фиксирует неизменяемый intent и resolved template version в SQL, а outbox публикует событие в priority queue. Планировщик хранит будущие intent в time buckets и переносит их в готовую очередь; отмена меняет состояние условной записью, поэтому worker перед созданием delivery повторно проверяет статус.

    Orchestrator получает контакты и верификацию из Contact Service, предпочтительную локаль и выбирает упорядоченный channel plan. Template Service рендерит subject/body по строгой схеме переменных, экранирует контент и возвращает hash результата для аудита. Для каждого канала создаётся delivery с отдельным state machine. Email, SMS и Push adapters имеют собственные очереди, quotas, rate limit и circuit breaker для поставщиков. Политика определяет, ждать ли permanent failure перед fallback или отправлять каналы параллельно для критического сообщения. Callback-и провайдеров проверяются криптографически и идемпотентно обновляют delivered/bounced, но отсутствие callback не трактуется как недоставка.

    Контакты шифруются, в очереди предпочтительно передаётся recipient reference, а структурированные логи маскируют адреса и payload. At-least-once закрывается уникальным delivery_id; для платного SMS повтор разрешён только после неопределённого результата согласно адаптерной политике. При деградации Template Service разрешён кэш опубликованных неизменяемых версий, но не черновиков. Наблюдаемость показывает accepted-to-start latency по priority, backlog по каналам, render failures, provider acceptance/delivery/bounce, fallback rate, SMS cost, schedule lateness и число отмен после старта. Трассировка по intent_id связывает все каналы, а алерты учитывают провайдера и локаль, чтобы локальный дефект шаблона не маскировался общей успешностью.
  tradeoffs:
    - "Последовательный fallback экономит каналы, параллельная отправка быстрее для критических сообщений, но создаёт дубли внимания."
    - "Сохранённый rendered body воспроизводим для аудита, повторный рендер экономит место, но может измениться вместе с шаблоном."
    - "SQL-планировщик прост для малых объёмов, time-bucket queue лучше масштабирует далёкие scheduled сообщения."
    - "Два SMS-провайдера повышают доступность, но усложняют маршрутизацию, стоимость и интерпретацию неизвестных результатов."
    - "Центральный orchestrator обеспечивает единую политику, отдельные channel workers изолируют сбои."
  diagram: diagrams/multichannel-notifications.gold.drawio
rubric_overrides:
  - "Кандидат должен описать state machine логического intent и отдельных channel deliveries."
  - "Оценивать версионирование шаблона, локализацию и безопасный рендер переменных."
  - "Нужна явная политика последовательного либо параллельного fallback."
  - "Схема должна показывать durable intent/outbox, time-bucket scheduler и проверку отмены перед созданием channel delivery."
