id: chronological-feed
title: Хронологическая лента
difficulty: 2
architecture_types:
  - feed
  - queues
duration_min: 40
canvas: blank
prompt_public: |
  Спроектируйте домашнюю ленту, где публикации подписок показываются строго в обратном хронологическом порядке.
hidden:
  functional:
    - "Публиковать пост и читать домашнюю ленту"
    - "Подписываться и отписываться от автора"
    - "Листать стабильным cursor pagination без дублей"
    - "Скрывать удалённые и заблокированные посты"
    - "Показывать новые посты без полного refresh"
  nonfunctional:
    - "p99 первой страницы менее 200 мс"
    - "Доступность чтения 99.95%"
    - "Новый пост виден подписчику за 5 секунд"
    - "Порядок детерминирован при одинаковом timestamp"
    - "Удаление исчезает из выдачи за 30 секунд"
    - "Пагинация возвращает все доступные посты snapshot без пропусков и дублей в пределах 30-дневной retention ленты"
  scale:
    - "20 млн DAU"
    - "120 млн постов в сутки"
    - "Средний пользователь читает 200 авторов"
