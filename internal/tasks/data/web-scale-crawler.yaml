id: web-scale-crawler
title: Веб-краулер масштаба интернета
difficulty: 4
architecture_types:
  - crawler
duration_min: 60
canvas: sketch
starter_diagram: diagrams/web-scale-crawler.starter.drawio
prompt_public: |
  Завершите архитектуру веб-краулера для построения поискового индекса.
  Сначала проясните границы системы и цели свежести.
hidden:
  functional:
    - "Принимать seed-наборы, обнаруживать новые URL и непрерывно переобходить известные"
    - "Соблюдать robots.txt, crawl-delay и отдельные бюджеты каждого host"
    - "Удалять точные и почти одинаковые документы до передачи индексатору"
    - "Приоритизировать авторитетные и часто меняющиеся страницы"
    - "Хранить сырые ответы и публиковать очищенные документы downstream"
  nonfunctional:
    - "99% выбранных для суток URL должны быть обработаны в пределах 24 часов"
    - "Ни один host не получает больше согласованного лимита даже при смене владельца шарда"
    - "Потеря региона не должна терять уже загруженные документы"
    - "Пайплайн допускает at-least-once, но выдача документа индексатору идемпотентна"
  scale:
    - "Каталог 50 млрд URL, ежедневно выбираются 2 млрд"
    - "Пик 40 тыс. HTTP-загрузок/с в трёх регионах"
    - "Средний сжатый ответ 180 КБ, суточный вход около 360 ТБ"
    - "Новые ссылки дают около 6 млрд сырых кандидатов в сутки"
    - "Примерно 30% ответов — дубли или near-duplicates"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "требован", "индекс", "robots", "дублик", "приоритет"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["sla", "свеж", "надёж", "регион", "идемпот", "лимит", "доступн"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["масштаб", "нагруз", "qps", "rps", "миллиард", "терабайт", "сколько", "объём"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Сервис отбора периодически оценивает известные URL по важности, ожидаемой частоте изменения и времени последней успешной загрузки. Он записывает кандидатов в распределённый фронтир, разделённый сначала по host, затем по временным бакетам. Каталог URL шардируется по нормализованному ключу и содержит canonical URL, статус, fingerprint, расписание и короткий lease. Host Directory назначает владельца politeness-состояния; epoch в lease не позволяет старому владельцу продолжать выдачу после ребалансировки. Диспетчер каждого шарда выпускает задания только при наличии host-токена и глобального регионального бюджета.

    Fetcher проверяет кеш robots.txt, выполняет DNS с защитой от приватных адресов, ограничивает размер и тип ответа и потоково пишет сырой объект в региональное хранилище. Событие об успешной фиксации объекта идёт парсеру. Тот извлекает текст, canonical hints и ссылки; URL normalizer перед массовой вставкой применяет локальный Bloom filter, а окончательная уникальность решается каталогом. Content hash отсекает точные копии, SimHash с LSH-кандидатами — близкие. Принятый очищенный документ публикуется индексатору с document_version, поэтому повторная доставка безопасна.

    Межрегиональная работа не должна параллельно обходить один host: домашний регион определяется стабильным rendezvous hashing, а перенос выполняется через epoch и выдержку lease. Загрузка считается зафиксированной только после durable-записи сырого объекта локально и хотя бы одной копии в другом регионе; лишь затем подтверждается fetch-задание и публикуется object event. Асинхронная обработка downstream может быть переиграна из этих копий после потери региона. Очереди разделены по стадиям, чтобы медленный parser или indexer создавал измеримый backpressure, а не блокировал fetch. 429 и 503 снижают host budget, DNS и TLS ошибки получают ограниченный backoff, poison HTML уходит в quarantine. Наблюдаемость включает frontier age по приоритету, coverage, fetch QPS, host fairness, robots cache, байты, межрегиональный replication lag, dedup ratio, stage lag и стоимость на миллион страниц. Выборочные трассы проходят от решения scheduler до версии документа.
  tradeoffs:
    - "Шардирование по URL vs host: URL равномернее, host-владение значительно проще обеспечивает politeness."
    - "Bloom filter до каталога vs только точная проверка: фильтр экономит I/O, но ложноположительно пропускает часть новых URL."
    - "Центральный scheduler vs автономные шарды: центр точнее оптимизирует приоритеты, но ограничивает масштаб и отказоустойчивость."
    - "Content hash vs SimHash: точный hash дешёв, near-duplicate поиск сокращает индекс ценой CPU и состояния."
    - "Активно-активные регионы vs домашний регион host: active-active утилизирует ресурсы, ownership проще исключает превышение лимита."
  diagram: diagrams/web-scale-crawler.gold.drawio
rubric_overrides:
  - "Кандидат должен показать владение politeness-состоянием по host и безопасный rebalance."
  - "Ожидается двухступенчатая дедупликация URL и отдельная дедупликация контента."
  - "Нужно оценить сотни терабайт в сутки и отделить object storage от метаданных."
  - "Gold-путь до индексатора должен быть идемпотентным по версии документа."
