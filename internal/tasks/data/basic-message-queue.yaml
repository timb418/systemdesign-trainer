id: basic-message-queue
title: Базовая очередь сообщений
difficulty: 2
architecture_types:
  - queues
  - key_value_store
duration_min: 40
canvas: blank
prompt_public: |
  Спроектируйте сервис очередей сообщений для внутренних приложений компании.
  Продюсеры публикуют сообщения, а воркеры забирают их на обработку. Уточните требования и предложите архитектуру.
hidden:
  functional:
    - "Создание очереди и публикация сообщения через API"
    - "Получение сообщений конкурентными consumer-ами с подтверждением обработки"
    - "Повторная доставка после истечения visibility timeout"
    - "Dead-letter queue после исчерпания лимита попыток"
    - "Удаление сообщения только после валидного ack"
  nonfunctional:
    - "Доставка at-least-once; consumer обязан быть идемпотентным"
    - "p99 publish < 50 мс, receive < 100 мс в пределах региона"
    - "Доступность API 99.95%"
    - "Потеря подтверждённых сообщений недопустима при отказе одного узла"
    - "Append order задаётся внутри partition; строгий порядок выдачи требует одного in-flight сообщения на message group"
  scale:
    - "2 000 очередей и до 100 активных consumer-ов на очередь"
    - "Средняя нагрузка 40k сообщений/с, пик 120k сообщений/с"
    - "Средний payload 2 КБ, максимум 256 КБ"
    - "Retention 7 дней: около 50 ТБ payload до репликации и 150 ТБ при RF=3"
    - "До 5 млн сообщений backlog в одной горячей очереди"
