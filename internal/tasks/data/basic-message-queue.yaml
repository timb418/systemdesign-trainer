  - id: functional
    keywords: ["функционал", "ack", "подтвержден", "повтор", "visibility", "dead-letter", "удален"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["гаранти", "порядок", "latency", "задержк", "доступн", "потер", "sla"]
    reveal: ["hidden.nonfunctional"]
