preferred_solution:
  narrative: |
    DNS или anycast направляет клиента в здоровый ближайший PoP, где TLS-терминатор проверяет host и передаёт запрос edge cache. Ключ включает tenant, нормализованный URL, допустимые Vary-заголовки, кодировку и при необходимости диапазон; авторизационные cookies по умолчанию делают ответ некэшируемым. RAM хранит горячие небольшие объекты, SSD — более широкий рабочий набор. На miss edge сначала обращается к региональному shield, а только shield — к origin. Singleflight по cache key объединяет одновременные промахи и не допускает всплеска к источнику.

    Ответ origin принимается только с разрешённым статусом и корректной политикой Cache-Control. Метаданные содержат ETag, expires_at, stale-if-error и generation. По истечении TTL edge может условно проверить ETag; 304 продлевает запись без передачи тела. Большие объекты обслуживаются range-запросами согласованными чанками, чтобы не создать миллионы уникальных фрагментов. При временной ошибке origin stale объект до десяти минут доступнее строгого 5xx, но помечается специальным заголовком.

    API инвалидизации аутентифицирует tenant, увеличивает generation URL или префикса в глобальном журнале и возвращает operation_id. Региональные подписчики читают упорядоченный поток, а PoP применяют tombstone к локальному индексу; физические байты удаляются позже. Периодическая сверка поколений закрывает разрыв после отключения PoP. При потере shield edge выбирает резервный с jitter, ограничителем соединений и circuit breaker; при изоляции PoP DNS health убирает маршрут. Метрики включают hit ratio по слоям, time-to-first-byte, egress, origin offload, coalesced requests, stale serves, SSD errors и invalidation lag. Синтетические проверки из регионов и алерт на 60 секунд подтверждают внешний SLA, а sampled logs позволяют найти ключи, раздувающие варианты.
  tradeoffs:
    - "Push-инвалидизация vs короткий TTL: push быстрее и экономнее, но требует надёжного глобального журнала."
    - "Один уровень edge vs origin shield: shield добавляет hop на miss, зато защищает origin и объединяет регионы."
    - "Кэширование range как объекта vs чанками: целый объект проще, чанки уменьшают лишнюю загрузку больших файлов."
    - "Serve stale vs немедленная ошибка: stale повышает доступность ценой ограниченной несвежести."
    - "Anycast vs GeoDNS: anycast быстрее реагирует маршрутизацией, GeoDNS даёт явный контроль, но страдает от TTL."
  diagram: diagrams/edge-cdn-cache.gold.drawio
rubric_overrides:
  - "Обязательны origin shield и request coalescing как защита источника."
  - "Ключ кэша должен учитывать Vary и варианты кодирования без взрыва кардинальности."
  - "Инвалидизация оценивается как надёжно распространяемое поколение или tombstone."
