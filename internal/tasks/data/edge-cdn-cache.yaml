    - "Поддерживать Cache-Control, ETag, range requests и разные варианты сжатия"
    - "Инвалидировать один URL или префикс по запросу владельца"
    - "Защищать origin с помощью request coalescing и многоуровневого кэша"
  nonfunctional:
