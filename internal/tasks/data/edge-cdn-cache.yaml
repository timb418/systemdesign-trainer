id: edge-cdn-cache
title: Кэш CDN на границе сети
difficulty: 2
architecture_types:
  - distributed_cache
duration_min: 35
canvas: blank
prompt_public: |
  Спроектируйте CDN-кэш для статических объектов продукта.
  Уточните правила свежести и географию.
