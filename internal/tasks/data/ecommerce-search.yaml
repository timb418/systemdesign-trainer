id: ecommerce-search
title: Поиск по каталогу интернет-магазина
difficulty: 3
architecture_types:
  - search
  - ecommerce
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте поиск по большому каталогу интернет-магазина. Покупатель вводит текст и ожидает релевантные товары. Уточните требования и предложите решение.
hidden:
  functional:
    - "Искать товары по названию, описанию, бренду и категории"
    - "Поддерживать фильтры, фасеты, сортировку и пагинацию"
    - "Учитывать региональную доступность, цену и остаток"
    - "Исправлять опечатки и понимать синонимы"
    - "Обновлять документ при изменении товара, цены или остатка"
  nonfunctional:
    - "p99 поисковой выдачи не более 300 мс"
    - "Доступность поиска 99.95%"
    - "Изменение цены видно не позднее 2 минут, снятие товара с продажи — за 15 секунд"
    - "Выдача одной страницы не должна содержать дубликаты"
    - "Деградация персонализации не должна делать поиск недоступным"
  scale:
    - "50 млн активных товарных предложений"
    - "15 млн DAU и пик 25 тысяч поисковых запросов в секунду"
    - "20 тысяч изменений каталога в секунду в пик"
    - "200 регионов, до 100 фильтруемых атрибутов в категории"
    - "Средний индексируемый документ 2 КБ: около 100 ГБ исходных документов и до 500 ГБ рабочего индекса до репликации"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "фильтр", "фасет", "сортиров", "опечат", "синоним", "остат", "цен"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "свежест", "дубликат", "деградац"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "dau", "каталог", "товар", "регион", "терабайт", "изменени"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Публичный API принимает query, category, filters, sort, region и page_token. Gateway передаёт запрос Search Orchestrator, который нормализует текст, определяет язык и категорию, расширяет синонимами и формирует запрос к распределённому инвертированному индексу. Индекс шардируется по стабильному hash product_id, реплики исполняют запрос параллельно, а coordinator объединяет top-K, фасеты и выдаёт непрозрачный search-after token. Отдельный ranking service может пересортировать небольшой набор кандидатов по бизнес-сигналам; его таймаут приводит к возврату базового BM25, а не к ошибке всего поиска.

    Источник истины — каталог и сервисы предложений. Их CDC-события идут в durable log, где indexer собирает документ из текста, категории, атрибутов и региональных полей, назначает версию и выполняет идемпотентный upsert. Обычная цена может отставать до двух минут, но событие снятия с продажи попадает в приоритетный поток и в deny-cache оркестратора. Перед ответом можно пакетно проверить доступность top-N в inventory service с жёстким deadline; при его отказе выдача помечает остаток неизвестным либо исключает рискованные позиции согласно продуктовой политике. Версионирование документа не позволяет позднему событию вернуть старую цену.

    Полная переиндексация строит новый индекс из snapshot каталога, затем догоняет CDC и переключает alias атомарно. Репликация шардов и routing around failed replicas поддерживают доступность; кэш хранит только популярные нормализованные запросы с коротким TTL и учитывает регион и фильтры. Наблюдаемость измеряет p99 по стадиям, timeout ranking и inventory, freshness lag, долю пустых результатов, CTR/NDCG на контрольной выборке, размер шардов и очередь обновлений. Алерты срабатывают на отставание критических удалений, перекос шардов, рост ошибок и несовпадение версий каталога с индексом.
  tradeoffs:
    - "Hash-шардинг равномерно распределяет товары, но каждый запрос делает scatter-gather; шардинг по категории уменьшает fan-out ценой перекоса."
    - "Денормализованный документ ускоряет фильтры, но усложняет обновления цены и регионального остатка."
    - "Проверка остатка на чтении свежее индекса, но добавляет зависимость и задержку в критический путь."
    - "Offset-пагинация удобна клиенту, search-after стабильнее и дешевле на глубоких страницах."
    - "ML reranking повышает качество, базовый lexical rank остаётся необходимым предсказуемым fallback."
  diagram: diagrams/ecommerce-search.gold.drawio
rubric_overrides:
  - "Оценивать модель индекса для текста, фасетов и региональных полей, а не только выбор поискового продукта."
  - "Кандидат должен развести обычную свежесть и срочное снятие товара с продажи."
  - "Нужна стратегия полной переиндексации без остановки чтения."
