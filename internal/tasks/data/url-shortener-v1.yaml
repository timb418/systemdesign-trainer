id: url-shortener-v1
title: Сокращатель ссылок
difficulty: 1
architecture_types:
  - url_shortener
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте сервис коротких ссылок. Пользователь вставляет длинный URL и получает короткий.
  Расскажите, с чего начнёте.
hidden:
  functional:
    - "Создать короткую ссылку по длинному URL"
    - "Редирект с короткой ссылки на оригинал (301 или 302 — кандидат должен выбрать и обосновать)"
    - "Опциональный кастомный alias"
    - "Базовая статистика: число переходов"
    - "Ссылки без авторизации; кастомный alias — для зарегистрированных"
  nonfunctional:
    - "Редирект p99 < 50 мс в одном регионе"
    - "Доступность 99.9%"
    - "Короткие коды не должны быть угадываемыми подряд (не autoincrement в URL)"
    - "TTL ссылок нет в v1, удаление — позже"
  scale:
    - "10 млн созданий ссылок в месяц"
    - "1 млрд редиректов в месяц"
    - "Пик редиректов ~20k QPS"
    - "Средняя длина URL 100 байт, код 7 символов base62"
reveal_on_question:
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "dau", "mau", "сколько пользователей", "масштаб", "трафик", "миллион"]
    reveal: ["hidden.scale"]
  - id: functional
    keywords: ["функционал", "какие фичи", "требования", "что должно", "алиас", "статистик", "аналитик"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "nfr", "неугадываем", "безопасность", "ttl"]
    reveal: ["hidden.nonfunctional"]
preferred_solution:
  narrative: |
    Запись: API принимает URL, генерирует 7-символьный код (base62 из crypto/rand или hash+salt),
    пишет в KV/SQL пару code→url, отдаёт короткий URL.
    Чтение: редирект идёт через HTTP-слой с кэшем (CDN или in-memory/Redis) по коду;
    cache miss — хранилище. Для 20k QPS чтений кэш обязателен.
    Счётчик кликов — асинхронно в очередь, чтобы не тормозить редирект.
    Кастомный alias — отдельное ограничение уникальности, только для авторизованных.
    301 vs 302: 301 кэшируется браузером (плохо для статистики и смены цели), для тренажёра лучше 302.
  tradeoffs:
    - "SQL vs KV: на этом масштабе хватит Postgres; KV проще для code→url, SQL удобнее для статистики и alias."
    - "Hash URL vs random ID: hash даёт коллизии одинаковых URL (можно как фичу дедупа); random проще и не палит оригинал."
    - "301 vs 302: 301 экономит QPS ценой потери контроля и кликов."
    - "Счётчик синхронно vs очередь: синхронно точнее, очередь держит p99 редиректа."
  diagram: diagrams/url-shortener-v1.gold.drawio
