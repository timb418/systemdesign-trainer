id: url-shortener-v1
title: Сокращатель ссылок
difficulty: 1
architecture_types:
  - url_shortener
  - metrics
  - distributed_cache
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте сервис коротких ссылок: пользователь передаёт длинный URL и получает короткий. Уточните требования и предложите архитектуру первой версии.
hidden:
  functional:
    - "Создание короткой ссылки по длинному URL"
    - "Редирект по коду на исходный URL с выбором 301/302"
    - "Уникальный пользовательский alias для авторизованного владельца"
    - "Асинхронный подсчёт общего числа переходов"
    - "Повторный запрос с idempotency key не создаёт лишнюю ссылку"
  nonfunctional:
    - "p99 редиректа менее 50 мс в одном регионе"
    - "Доступность редиректа 99.9% в месяц"
    - "Коды нельзя выдавать последовательным autoincrement"
    - "Потеря кликов допустима не более 0.1%, но не должна влиять на редирект"
    - "URL проверяется по allowlist протоколов и ограничению длины"
  scale:
    - "10 млн новых ссылок в месяц"
    - "1 млрд редиректов в месяц"
    - "Пиковая нагрузка редиректов 20k QPS"
    - "Средний исходный URL 100 байт, код — 7 символов base62"
    - "Соотношение чтений к записям около 100:1"
reveal_on_question:
  - id: functional
    keywords: ["создать короткую ссылку", "редирект", "custom alias", "idempotency key", "статистика переходов"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["p99 редиректа", "доступность redirect", "коллизии кодов", "потеря кликов", "валидация URL"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "scale", "сколько пользователей", "редиректов в месяц", "новых ссылок", "redirect QPS", "read write ratio", "длина base62"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Контракт и границы.
    POST /v1/links принимает target_url, optional alias и idempotency key; GET /{code} возвращает 302, а GET /v1/links/{code}/stats — агрегат владельцу.
    Валидация запрещает javascript:, file: и слишком длинные адреса.
    Модель данных.
    Основная запись link содержит code, target_url, owner_id, created_at и status; уникальный индекс защищает code и alias.
    Idempotency key хранится отдельно с TTL.
    Сырые click events не добавляются в строку ссылки.
    Основные потоки.
    Создание резервирует случайный base62-код через crypto/rand и повторяет попытку при коллизии.
    Редирект сначала читает Redis, затем Postgres и заполняет кэш; событие клика неблокирующе отправляется в очередь и агрегируется отдельно.
    Масштабирование.
    Stateless redirect-сервисы масштабируются за балансировщиком, горячие коды держатся в Redis с TTL и защитой от stampede.
    Реплики БД обслуживают промахи чтения, а запись остаётся на primary; 20k QPS поглощает кэш.
    Согласованность.
    Создание и alias требуют строгой уникальности в primary.
    После создания первый redirect может читать primary или прогреваться записью в кэш, чтобы не попасть в lag реплики.
    Счётчики кликов eventually consistent и дедуплицируются по event_id.
    Отказы и восстановление.
    При недоступном Redis сервис ограниченно читает БД и включает circuit breaker, чтобы не обрушить primary.
    Ошибка очереди не ломает redirect: события кратко буферизуются или семплируются.
    Неактивная ссылка даёт стабильный 404/410.
    Наблюдаемость.
    Измеряются p50/p95/p99 редиректа, hit ratio и latency Redis, QPS и saturation БД, коллизии генератора, lag очереди и доля отброшенных click events.
    SLO алерты разделяют критичный redirect и вторичную аналитику.
    Практические решения.
    Для v1 подходит Postgres с партиционированием позже: объём записей умеренный, а уникальность alias проста.
    302 сохраняет контроль и статистику; 301 можно разрешить как явную настройку.
    Кэшируются только активные ссылки, негативный результат — очень коротко.
  tradeoffs:
    - "Postgres против KV: SQL проще для уникального alias, KV дешевле масштабирует lookup"
    - "Случайный base62 против hash URL: random скрывает корреляцию, hash даёт естественную дедупликацию"
    - "302 против 301: контроль и точная статистика против browser cache"
    - "Асинхронный счётчик против синхронного: низкий p99 против точного ответа сразу"
  diagram: diagrams/url-shortener-v1.gold.drawio
rubric_overrides:
  - "Кандидат обязан сохранить и учесть пик 20k QPS"
  - "Отдельно оценивается защита от коллизий и гонки alias"
  - "Счётчики не должны находиться на критическом пути redirect"
  - "Выбор 301/302 должен быть связан с кэшем и аналитикой"
