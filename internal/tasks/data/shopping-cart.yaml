id: shopping-cart
title: Корзина интернет-магазина
difficulty: 1
architecture_types:
  - ecommerce
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте сервис корзины для интернет-магазина.
  Уточните жизненный цикл, конкурирующие изменения и границу с checkout.
hidden:
  functional:
    - "Добавлять, изменять количество и удалять товар из корзины"
    - "Поддерживать гостевую корзину и слияние после входа"
    - "Показывать актуальную цену и доступность без резервирования товара"
    - "Создавать неизменяемый checkout snapshot по запросу пользователя"
  nonfunctional:
    - "GetCart p99 < 100 мс, изменение p99 < 200 мс"
    - "Доступность 99.99%"
    - "Повтор одного mutation request не меняет количество второй раз"
    - "Корзина хранится 30 дней после последней активности"
  scale:
    - "50 млн активных корзин"
    - "Пик 200 тыс. чтений/с и 80 тыс. изменений/с"
    - "Средняя корзина содержит 6 строк, максимум 100"
    - "Около 35% гостевых корзин сливаются с аккаунтом"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "требован", "гост", "слиян", "цена", "налич", "checkout"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задерж", "доступн", "идемпот", "ttl", "дней", "sla"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["масштаб", "нагруз", "qps", "корзин", "строк", "сколько", "пик"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    API использует cart_id для гостя или user_id после входа. Cart Service хранит документ корзины, version, updated_at и expires_at в шардированном key-value хранилище по идентификатору владельца. Mutation передаёт operation_id, ожидаемую version, SKU и новое абсолютное quantity, а не команду «прибавить один»: условная запись делает retry идемпотентным и возвращает конфликт при редактировании со второго устройства. Небольшая таблица последних operation_id в документе либо отдельный dedup store закрывает timeout после успешного commit.

    GetCart получает базовые строки и параллельно пакетно запрашивает Product/Pricing и Availability через короткие кэши. Цена и наличие являются аннотацией, не частью авторитетного состояния корзины; добавление не резервирует склад. При недоступности зависимостей сервис может показать последнюю цену с отметкой, но checkout обязан перепроверить. Cart document ограничен ста строками и размером, чтобы один горячий пользователь не создавал неограниченное значение. Sliding TTL обновляется не на каждом чтении, а периодически при изменениях, снижая write amplification.

    При login MergeCart читает гостевой и пользовательский документы, объединяет SKU по заранее заданной политике количества, ограничивает максимум и условно записывает новую user version. Mapping guest→user и merge operation id предотвращают повторное слияние; старый guest cart получает redirect marker. Checkout создаёт immutable snapshot с item quantities и наблюдаемыми версиями цен, затем другой сервис валидирует цену и резервирует inventory. События cart_changed и snapshot_created публикуются через outbox для аналитики, но не нужны для ответа пользователю.

    При падении узла KV реплика обслуживает запросы; конфликт версий возвращается клиенту для обновления, а не молча теряет изменения. Метрики включают p99, document size, CAS conflicts, dedup hits, merge failures, dependency latency, stale prices и TTL expirations. Алерты реагируют на рост конфликтов, ошибки KV и деградацию Pricing; трасса разделяет базовое чтение и enrich-вызовы.
  tradeoffs:
    - "Документ корзины vs строка на SKU: документ даёт одну атомарную запись, но ограничивает размер и создаёт конфликты."
    - "Абсолютное quantity vs increment: абсолютное значение проще идемпотентно, increment удобнее для CRDT-сценария."
    - "Цена в корзине vs динамический enrich: сохранённая цена быстрее, но быстро устаревает."
    - "Last-write-wins vs optimistic version: LWW проще, version обнаруживает потерю параллельного изменения."
    - "Сумма vs максимум при merge: сумма сохраняет намерения обеих корзин, но может неожиданно увеличить заказ."
  diagram: diagrams/shopping-cart.gold.drawio
rubric_overrides:
  - "Корзина не должна резервировать склад; резерв появляется только в checkout."
  - "Mutation retry обязан быть идемпотентным и не удваивать quantity."
  - "Оценивать детерминированное и повторяемое слияние guest cart."
