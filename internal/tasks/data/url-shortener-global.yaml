  functional:
    - "Создавать ссылки в любом из трёх регионов"
    - "Редиректить пользователя через ближайший здоровый регион"
    - "Поддерживать глобально уникальные кастомные alias"
    - "Блокировать вредоносную ссылку глобально не позднее заданного срока"
    - "Переносить домашний регион владельца без смены короткого кода"
  nonfunctional:
    - "p99 редиректа менее 80 мс для 95% мировой аудитории"
    - "Доступность redirect 99.99% в месяц"
    - "Потеря целого региона не прерывает чтения более 60 секунд"
    - "Глобальная блокировка распространяется до 30 секунд"
    - "RPO созданных ссылок не хуже 5 секунд"
  scale:
    - "3 активных региона и 120 млн активных ссылок"
    - "150k QPS редиректов глобально, 40% приходится на один регион"
    - "2k QPS создания ссылок в пике"
