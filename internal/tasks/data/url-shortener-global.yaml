id: url-shortener-global
title: Глобальный сокращатель ссылок
difficulty: 4
architecture_types:
  - url_shortener
  - distributed_cache
  - key_value_store
duration_min: 60
canvas: sketch
starter_diagram: diagrams/url-shortener-global.starter.drawio
prompt_public: |
  Перед вами одно-региональный сокращатель ссылок. Превратите его в глобальный сервис с локальными редиректами и переживанием потери региона.
