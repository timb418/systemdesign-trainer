id: meeting-room-booking
title: Бронирование переговорных
difficulty: 1
architecture_types:
  - booking_inventory
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте сервис бронирования переговорных внутри компании.
  Уточните правила конфликтов и основные пользовательские сценарии.
hidden:
  functional:
    - "Искать свободные комнаты по офису, времени и вместимости"
    - "Создавать, изменять и отменять разовые бронирования"
    - "Не допускать пересекающихся подтверждённых броней одной комнаты"
    - "Добавлять участников и отправлять уведомления"
    - "Показывать календарь комнаты и пользователя"
  nonfunctional:
    - "Создание брони p99 < 500 мс"
    - "Доступность чтения 99.9%, записи 99.5%"
    - "Ни при каких retry нельзя создать две брони из одного запроса"
    - "Поиск может отставать от подтверждения не более чем на 5 секунд"
  scale:
    - "50 тыс. комнат в 200 офисах"
    - "2 млн сотрудников и 300 тыс. броней в день"
    - "Пик 2 тыс. поисков/с и 500 изменений/с"
    - "История хранится 2 года, средняя бронь включает 8 участников"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "требован", "поиск", "отмен", "участ", "календар", "конфликт"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задерж", "доступн", "идемпот", "свеж", "sla"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["масштаб", "нагруз", "qps", "комнат", "сотрудник", "брон", "сколько"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    API поиска принимает office_id, интервал, вместимость и оборудование. Для быстрого отбора индекс комнат хранит статические свойства, а занятость читается из проекции календаря, которая может отставать до пяти секунд. Результат поиска поэтому является кандидатом, а не обещанием: окончательная проверка выполняется при CreateBooking. Запрос создания содержит idempotency_key, room_id, start, end, organizer и участников. Сервис валидирует границы и в одной транзакции блокирует календарь конкретной комнаты на соответствующую дату, повторно проверяет пересечение и вставляет подтверждённую бронь с уникальным idempotency key.

    В Postgres используется exclusion constraint по room_id и полуоткрытому диапазону [start, end) с частичным предикатом только для активных статусов; отменённые брони сохраняются для аудита, но больше не блокируют интервал. Ограничение остаётся последней защитой даже при ошибке приложения. Изменение времени выполняется транзакционно: старая бронь не удаляется до успешной проверки нового интервала. Отмена меняет статус, сохраняя аудит. Таблицы разделяются по office и месяцу истории; текущий рабочий набор индексируется по комнате и началу. Booking и строка outbox записываются одной транзакцией в той же primary БД; отдельный relay публикует событие после commit. Уведомитель читает события at-least-once, дедуплицирует по booking_version и отправляет письма или push вне критического пути.

    При timeout клиент безопасно повторяет idempotency key и получает исходный результат. Если сервис упал до commit, брони нет; если после commit до ответа, повтор найдёт её. Конфликт возвращает 409 и альтернативные комнаты из свежего поиска. Отказ уведомлений не откатывает бронь, события повторяются с backoff и уходят в DLQ. Читающие реплики могут обслуживать историю, но создание всегда обращается к primary, чтобы не проверять устаревшие данные. Метрики включают create latency, conflict rate, transaction retries, projection lag, поиск без результатов, outbox age и delivery success. Алерты реагируют на lag более пяти секунд, рост deadlocks и остановку outbox; аудит связывает пользователя, idempotency key и версии изменения.
  tradeoffs:
    - "Поиск из SQL vs отдельная проекция: SQL свежее, проекция быстрее фильтрует большой офис."
    - "Pessimistic lock vs optimistic constraint: lock уменьшает конфликты commit, constraint проще и остаётся гарантией."
    - "Синхронные уведомления vs outbox: синхронные дают немедленную ошибку, outbox не задерживает бронь."
    - "Удаление отменённых броней vs статус: удаление экономит место, статус сохраняет аудит и идемпотентность."
  diagram: diagrams/meeting-room-booking.gold.drawio
rubric_overrides:
  - "Результат поиска не должен считаться резервированием инвентаря."
  - "Пересечение броней должно предотвращаться транзакцией и ограничением данных."
  - "Retry создания обязан использовать сохранённый idempotency key."
