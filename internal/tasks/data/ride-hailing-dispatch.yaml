id: ride-hailing-dispatch
title: Диспетчеризация поездок такси
difficulty: 4
architecture_types:
  - geo
  - queues
duration_min: 55
canvas: blank
prompt_public: |
  В текущем наброске координаты водителей записываются в одну базу, а заказ ищет ближайшего водителя SQL-запросом. Спроектируйте диспетчеризацию поездок в городе под высокой нагрузкой.
hidden:
  functional:
    - "Принимать доступность и позицию водителей"
    - "Создавать запрос поездки с точками подачи и назначения"
    - "Находить кандидатов и предлагать поездку с ограниченным сроком"
    - "Гарантировать, что водитель не назначен двум активным поездкам"
    - "Повторять поиск, отменять и переназначать при отказе или таймауте"
  nonfunctional:
    - "Первое предложение водителю создаётся за 2 секунды p95"
    - "Назначение доступно 99.99%"
    - "Двойное подтверждённое назначение недопустимо"
    - "Позиция кандидата должна быть не старше 10 секунд"
    - "Отказ одной зоны города не должен останавливать остальные зоны"
  scale:
    - "10 млн онлайн-водителей глобально"
    - "Пик 200 тысяч новых запросов поездки в секунду"
    - "Позиция каждого водителя обновляется раз в 3 секунды"
    - "До 100 кандидатов рассматривается на запрос, предложение отправляется группами по 3"
    - "500 городов, крупнейшая зона содержит 200 тысяч доступных водителей"
