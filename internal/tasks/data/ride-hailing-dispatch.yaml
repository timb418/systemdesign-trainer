  - id: functional
    keywords: ["функционал", "водител", "позици", "заказ", "кандидат", "предлож", "назнач", "отказ", "таймаут"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "секунд", "доступн", "sla", "двойн", "консистент", "свежест", "зона", "отказ"]
