id: idempotent-checkout
title: Идемпотентный checkout
difficulty: 2
architecture_types:
  - payments
  - ecommerce
duration_min: 40
canvas: blank
prompt_public: |
  Спроектируйте checkout интернет-магазина, который создаёт заказ и принимает оплату.
  Пользователь может повторить запрос из-за таймаута. Уточните требования и обеспечьте корректный результат.
hidden:
  functional:
    - "Создание checkout по корзине и расчёт итоговой суммы"
    - "Резерв товара и вызов внешнего платёжного провайдера"
    - "Повтор запроса с тем же idempotency key возвращает прежний результат"
    - "Запрос состояния заказа после неопределённого timeout"
    - "Освобождение резерва или возврат при окончательной ошибке"
  nonfunctional:
    - "Пользователь не должен получить два заказа или два списания от повторного запроса"
    - "p95 принятия checkout < 300 мс без ожидания финального ответа провайдера"
    - "Доступность создания 99.95%, состояние заказа не теряется"
    - "Сумма и валюта фиксируются сервером и не доверяются клиенту"
    - "Все денежные переходы имеют неизменяемый аудит"
  scale:
    - "5 млн checkout в день, пик 2k запросов/с"
    - "15% клиентов повторяют запрос хотя бы один раз"
    - "Средняя корзина 5 позиций, каталог 10 млн SKU"
    - "Ответ провайдера 100 мс–30 с, 0.5% timeout"
    - "Idempotency records хранятся 48 часов, заказы 7 лет"
reveal_on_question:
  - id: functional
    keywords: ["корзин", "резерв", "оплат", "повтор", "статус", "возврат", "ошиб"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["идемпот", "дубликат", "latency", "доступн", "сумм", "аудит", "гаранти"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "масштаб", "сколько", "повтор", "sku", "timeout", "retention", "дней"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Клиент генерирует Idempotency-Key на одну логическую попытку покупки и вызывает POST /checkouts. Gateway аутентифицирует пользователя, но дедупликация выполняется в сервисе: в SQL есть уникальный индекс (merchant_id, idempotency_key). В транзакции создаются IdempotencyRecord с hash нормализованного запроса и Order в состоянии PENDING. Повтор с тем же ключом и hash возвращает сохранённый status/body, а тот же ключ с иным содержимым получает 409. Цена читается сервером, сумма, валюта и состав корзины фиксируются immutable snapshot-ом.

    Checkout state machine последовательно резервирует inventory и инициирует payment. В той же локальной транзакции переход состояния пишет outbox; relay доставляет команду at-least-once. Inventory reserve использует order_id как idempotency key. Платёжному провайдеру передаётся стабильный key payment:{order_id}:authorize. Если вызов завис, состояние остаётся PAYMENT_UNKNOWN, а reconciler запрашивает провайдера по ключу; создавать новую авторизацию нельзя. После подтверждения заказ становится CONFIRMED, а сохранённый ответ idempotency record обновляется. Ошибка запускает идемпотентное release резерва; если списание подтвердилось после отмены, saga делает refund.

    База шардируется по merchant_id/order_id, но Order и IdempotencyRecord размещаются совместно для одной транзакции; RF=3 между зонами. Строка блокируется только на короткий CAS-переход version, внешние вызовы выполняются вне транзакции. Таймаут API возвращает 202 с order_id и Location для GET /orders/{id}. Повторная доставка команд безопасна, а зависшие state обнаруживает sweeper. Метрики включают duplicate hit/mismatch, checkout state age, inventory compensation, provider timeout, unknown backlog, double-charge invariant violations и outbox lag. Audit log и trace связывают ключ клиента, order_id и provider key.
  tradeoffs:
    - "Синхронное ожидание оплаты проще для клиента, но внешний timeout удерживает запрос и не устраняет неизвестный результат."
    - "SQL unique index надёжнее отдельного кэша идемпотентности, хотя создаёт запись на каждый checkout."
    - "Saga доступнее 2PC с внешними системами, но требует компенсаций."
    - "Хранение полного ответа обеспечивает точный replay, но требует политики TTL и защиты данных."
  diagram: diagrams/idempotent-checkout.gold.drawio
rubric_overrides:
  - "Кандидат отличает повтор того же запроса от повторного использования ключа с другим payload."
  - "Внешний timeout переводится в UNKNOWN и reconciliation, а не в новую оплату."
  - "Внешний вызов не выполняется внутри долгой SQL-транзакции."
