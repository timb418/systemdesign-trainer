id: flash-sale-platform
title: Платформа флеш-распродаж
difficulty: 4
architecture_types:
  - ecommerce
duration_min: 60
canvas: blank
prompt_public: |
  Спроектируйте ограниченную по времени распродажу небольшого остатка товара.
  Уточните справедливость, защиту от oversell и пользовательский путь.
