  functional:
    - "Пускать покупателей через виртуальную очередь к выбранной акции"
    - "Показывать остаток приблизительно и создавать краткий reservation"
    - "Ограничивать покупку двумя единицами на аккаунт и устройство"
    - "Подтверждать заказ после оплаты или возвращать остаток после expiry"
    - "Противодействовать ботам и повторному использованию admission token"
  nonfunctional:
    - "Подтверждённые заказы никогда не превышают выделенный акции остаток"
    - "CreateReservation p99 < 500 мс для допущенного клиента"
    - "Очередь выдерживает региональный сбой без потери принятой позиции"
