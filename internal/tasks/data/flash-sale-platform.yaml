preferred_solution:
  narrative: |
    CDN отдаёт страницу акции, а edge rate limiting, proof-of-work или CAPTCHA и device reputation отсекают простую автоматизацию до дорогих сервисов. Waiting Room создаёт для account/device один durable queue entry с глобально упорядоченным sequence внутри sale_id. Подписанный токен позиции можно повторно использовать только для просмотра статуса. Admission controller следит за p99 inventory, payment backlog и числом активных reservation, затем переводит следующий диапазон sequence в ADMITTED и выдаёт короткоживущий одноразовый admission token. Состояние очереди реплицируется между зонами; новый leader имеет fencing epoch и продолжает с подтверждённого high-water mark.

    Reservation Service шардируется по sale_id и держит авторитетный счётчик available, но сверхгорячую акцию обслуживает один логический consensus leader. CreateReservation проверяет token, purchase-limit ledger и idempotency key. В одной транзакции условное уменьшение available, запись reservation с expires_at, потребление admission token и provisional лимит аккаунта выполняются вместе. Это сериализует успешные изменения, зато верхний admission в 30 тысяч запросов в секунду и batching журнала делают нагрузку ограниченной; приблизительный остаток публикуется через кэш и никогда не используется как гарантия.

    Клиент оплачивает по payment intent. Webhook вызывает идемпотентный Confirm, который условно меняет ACTIVE→CONFIRMED и создаёт order. Durable timer плюс sweeper переводят просроченное ACTIVE→EXPIRED, возвращают quantity и provisional limit; CAS разрешает гонку с confirm ровно одним исходом. Если платёж успешен после expiry, saga делает refund, не создавая oversell. Все переходы и outbox-события находятся в одной БД-транзакции, consumers дедуплицируют event_id.

    При отказе leader запись кратко останавливается до quorum failover; доступность не важнее остатка. Перегрузка платежей уменьшает admission, а не копит бесконечные reservation. Метрики включают queue age и sequence fairness, token replay, bot rejection, admission rate, available invariant, reservation latency, expiry lag, payment mismatch и refund. Алерты реагируют на отрицательный остаток, расхождение ledger, stale leader epoch и очередь вне прогноза; аудит связывает device, account, queue, reservation, payment и order.
  tradeoffs:
    - "Строгий FIFO vs лотерея: FIFO прозрачен, лотерея снижает преимущество сетевой близости и ботов."
    - "Один leader акции vs распределённые квоты: leader проще исключает oversell, квоты дают throughput ценой возврата остатков."
    - "Reservation перед оплатой vs атомарное списание: reservation улучшает UX, но временно блокирует непроданный товар."
    - "Точный остаток в UI vs приблизительный: точный создаёт горячие чтения, приблизительный масштабируется."
    - "Fail-closed vs fail-open при потере quorum: fail-closed сохраняет инвариант, но временно останавливает продажи."
    - "Жёсткий account limit vs device/signals: аккаунт понятен, дополнительные сигналы усложняют обход ботами."
  diagram: diagrams/flash-sale-platform.gold.drawio
rubric_overrides:
  - "Виртуальная очередь обязана иметь durable sequence и fencing при failover."
  - "Admission должен динамически защищать inventory и payment, а не только web tier."
  - "Уменьшение остатка, лимит покупателя и reservation фиксируются атомарно."
  - "Confirm и expiry должны иметь взаимоисключающие условные переходы."
  - "Нужно выбрать между одним leader и распределёнными квотами, объяснив oversell."
