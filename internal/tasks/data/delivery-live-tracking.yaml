id: delivery-live-tracking
title: Отслеживание доставки в реальном времени
difficulty: 3
architecture_types:
  - geo
  - queues
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте сервис, в котором клиент видит движущегося курьера и статус заказа почти в реальном времени. Опишите запись координат и доставку обновлений.
hidden:
  functional:
    - "Принимать координаты, скорость и sequence от приложения курьера"
    - "Показывать клиенту последнюю позицию и статус его заказа"
    - "Передавать live-обновления через WebSocket или SSE"
    - "Хранить историю маршрута для поддержки и расчёта качества"
    - "Скрывать точную позицию до назначения и после завершения заказа"
  nonfunctional:
    - "Позиция на экране отстаёт от устройства не более чем на 3 секунды p95"
    - "Доступность чтения 99.95%, приёма 99.9%"
    - "Позднее или повторное событие не должно откатывать маркер"
    - "После завершения доступ клиента к координатам закрывается за 5 секунд"
    - "Краткий разрыв WebSocket восстанавливается без полного replay истории"
  scale:
    - "5 млн активных курьеров в пик"
    - "Одна позиция каждые 3 секунды, пик около 1.7 млн обновлений в секунду"
    - "20 млн одновременно наблюдающих клиентов"
    - "Среднее событие 150 байт, около 20 ТБ сырых данных в сутки"
    - "Горячая последняя позиция хранится 24 часа, история — 30 дней"
