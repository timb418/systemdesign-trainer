preferred_solution:
  narrative: |
    Courier SDK пакетирует location с courier_id, active_order_id, device_time, monotonic sequence, accuracy и speed и отправляет через региональный gRPC/HTTP ingest. Gateway аутентифицирует назначенное устройство, ограничивает частоту и записывает событие в partitioned durable log по courier_id. Подтверждение возможно после репликации журнала; SDK хранит небольшой буфер при потере сети и отправляет его с исходными sequence. Stream processor отбрасывает невозможные скачки, но сохраняет raw для расследования, и условно обновляет Last Location Store только если sequence новее.

    Tracking API сначала проверяет связь viewer с активным order и его state, затем возвращает snapshot с last_sequence. WebSocket gateways подписывают соединение на order channel в regional pub/sub. Location processor преобразует courier update в минимальный order update и публикует его; gateway отправляет только авторизованным текущим подписчикам. Клиент интерполирует движение между точками, но показывает timestamp свежести. При reconnect он передаёт last_sequence: сервер возвращает последнюю точку и небольшой ring buffer событий после неё, а не месячную историю. Статусы заказа приходят из Order Service через тот же channel и определяют разрешённое окно показа.

    Завершение заказа атомарно меняет authorization projection и публикует revoke с более высоким control sequence; gateway немедленно закрывает подписки, а каждый location fan-out повторно сверяет active mapping. Точная позиция вне окна заменяется грубым статусом. История асинхронно складывается из log в columnar object storage с TTL и ограниченным RBAC. Партиции распределяются по courier_id, connection gateways масштабируются отдельно от ingest, а популярный order всё равно имеет малый fan-out. Backpressure снижает частоту промежуточных точек, сохраняя последнюю. Метрики включают device-to-screen latency, ingest lag, stale markers, sequence drops, pub/sub delay, connections, reconnect success, revoke propagation и подозрительные координаты. Трассировка по order_id выборочно связывает ingest с push, а privacy-аудит отслеживает чтения истории и утечки после завершения.
  tradeoffs:
    - "WebSocket даёт двусторонний контроль и низкую задержку, SSE проще, но всё равно требует управления миллионами соединений."
    - "Durable log повышает восстановимость, прямой pub/sub быстрее, но теряет обновления при сбое."
    - "Хранение по courier_id упорядочивает sequence, маршрутизация подписок по order_id требует отдельной проекции."
    - "Каждая точка плавнее, coalescing до последней позиции защищает систему под backpressure."
    - "Клиентская интерполяция визуально плавная, но обязана показывать свежесть и не выдумывать фактический маршрут."
  diagram: diagrams/delivery-live-tracking.gold.drawio
rubric_overrides:
  - "Кандидат должен обеспечить монотонность sequence при offline buffer, повторах и поздних событиях."
  - "Оценивать отдельное масштабирование location ingest и долговременных WebSocket connections."
  - "Нужен быстрый revoke доступа после завершения заказа на всех путях fan-out."
  - "Revoke обязан исходить из control/order plane и распространяться к gateway; одного pull-check при подписке недостаточно."
