id: exactly-once-workflow
title: Workflow с эффектом ровно один раз
difficulty: 4
architecture_types:
  - queues
  - payments
  - key_value_store
duration_min: 70
canvas: sketch
starter_diagram: diagrams/exactly-once-workflow.starter.drawio
prompt_public: |
  На доске показан простой workflow: API кладёт команду в очередь, worker вызывает внешний сервис и записывает результат.
  Требуется не допустить повторного бизнес-эффекта даже при сбоях. Разберите ограничения исходной схемы и спроектируйте решение.
hidden:
  functional:
    - "Запуск многошагового workflow с устойчивым статусом каждого шага"
    - "Вызов внешнего платёжного API без повторного списания"
    - "Повтор шага после timeout и восстановление зависших workflow"
    - "Компенсация уже выполненных шагов при окончательном отказе"
    - "Запрос статуса и аудит всех решений оркестратора"
  nonfunctional:
    - "Exactly-once относится к бизнес-эффекту, а транспорт остаётся at-least-once"
    - "Нельзя использовать распределённую транзакцию с внешним провайдером"
    - "99.99% workflow завершаются или переходят в ручное разбирательство без потери состояния"
    - "p99 принятия команды < 150 мс; долгий workflow асинхронен"
    - "Состояние должно переживать потерю зоны и повтор событий"
  scale:
    - "25k новых workflow/с, пик 70k/с"
    - "До 20 шагов и 7 дней жизни одного workflow"
    - "40 внешних провайдеров, timeout ответа до 30 секунд"
    - "500 млн активных или недавно завершённых workflow"
    - "Аудит хранится 7 лет, около 3 ПБ до сжатия"
