  - id: functional
    keywords: ["функционал", "crawler", "обход", "robots", "индекс", "ранжир", "дубликат", "спам", "snippet"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "свежест", "удален", "crawl-delay", "вежлив"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "страниц", "url", "петабайт", "язык", "регион", "миллиард"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    URL Frontier хранит нормализованные адреса, приоритет и next_fetch_at. Планировщик сначала выбирает host buckets, затем URL внутри host, поэтому глобальная производительность не нарушает robots.txt, crawl-delay и лимит соединений к origin. Fetchers получают DNS и HTTP, ограничивают размер ответа, сохраняют сырой объект и метаданные, а parser извлекает текст, язык, canonical и исходящие ссылки. Seen-URL service с fingerprint подавляет повторное планирование; контентный SimHash обнаруживает зеркала и почти дубликаты. Сигналы ошибок, частоты изменений, PageRank и спроса определяют следующий recrawl.

    Документный pipeline очищает HTML, применяет spam/malware классификацию, строит термы, позиции и поля. Immutable сегменты инвертированного индекса создаются по document snapshot, реплицируются и публикуются через versioned manifest. Link graph рассчитывает authority отдельно. Срочные юридические удаления идут в deny service, который проверяется и при ранжировании, и при формировании snippet, не ожидая многодневной compaction. Query Frontend нормализует запрос, определяет язык и регион, получает исправления и варианты, затем broker рассылает запрос только релевантным index shards. Реплики возвращают lexical top-N, ranker объединяет текстовые, ссылочные, свежие и качественные признаки, а document store даёт title и заранее подготовленные passage blocks для snippet.

    Индекс шардируется по document_id для равномерности; broker выполняет scatter-gather с deadline, hedged request только для медленных реплик и кэширует популярные запросы по версии индекса. При недоступности части шардов можно вернуть явно деградированную страницу, но старый целый manifest предпочтительнее смешивания поколений. Raw pages и сегменты лежат в object storage, что позволяет восстановить узлы и переиндексировать без повторного обхода. Метрики охватывают crawl politeness, frontier age, fetch success, duplicate ratio, indexing watermark, shard coverage, p99 стадий, cache hit, NDCG, spam rate и срок удаления. Распределённая трассировка и query sampling позволяют отличать сетевой хвост от дорогого posting list или ranker.
  tradeoffs:
    - "Шардирование по документу балансирует объём, но требует fan-out; по терму уменьшает fan-out ценой огромных горячих posting lists."
    - "Частый recrawl повышает свежесть, но расходует bandwidth и рискует нарушить politeness."
    - "Хранение сырого HTML дорого, зато позволяет повторно парсить и индексировать без нагрузки на сайты."
    - "Предрасчитанные snippets быстрее, динамические точнее соответствуют конкретному запросу."
    - "Глубокий ML-ranker улучшает качество, каскад lexical candidates ограничивает его стоимость и latency."
    - "Частичная выдача повышает доступность, но полнота непредсказуема; versioned manifests дают воспроизводимость."
  diagram: diagrams/web-search-engine.gold.drawio
rubric_overrides:
  - "Отдельно оценивать polite scheduling по origin, robots.txt и adaptive recrawl."
  - "Кандидат должен разделить URL-дедупликацию и дедупликацию содержимого."
  - "Нужны versioned immutable index segments и стратегия публикации без смешения поколений."
  - "Юридическое удаление должно работать быстрее физического перестроения индекса."
  - "Оценивать многоступенчатое ранжирование и контроль качества, а не только полнотекстовый движок."
