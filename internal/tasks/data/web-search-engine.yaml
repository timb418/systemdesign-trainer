id: web-search-engine
title: Поисковая система для веба
difficulty: 5
architecture_types:
  - search
  - crawler
duration_min: 60
canvas: blank
prompt_public: |
  Спроектируйте веб-поиск: система обходит открытые страницы и отвечает на текстовые запросы пользователей. Определите границы задачи и архитектуру.
hidden:
  functional:
    - "Находить и обходить публичные HTTP-страницы с соблюдением robots.txt"
    - "Извлекать текст, ссылки, canonical URL и язык документа"
    - "Индексировать документы и ранжировать результаты по запросу"
    - "Удалять дубликаты, спам и страницы по юридическому запросу"
    - "Показывать title, URL и релевантный snippet"
  nonfunctional:
    - "p99 ответа первой страницы не более 700 мс"
    - "Доступность поиска 99.99%"
    - "Популярная изменённая страница переиндексируется за 15 минут, обычная — за 7 дней"
    - "Удаление по юридическому запросу скрывается за 10 минут"
    - "Crawler не должен перегружать отдельный origin и обязан соблюдать crawl-delay"
  scale:
    - "50 млрд известных URL и 10 млрд индексируемых документов"
    - "Обход 5 млрд страниц в сутки, средний ответ после сжатия 100 КБ"
    - "Пик 150 тысяч поисковых запросов в секунду"
    - "Инвертированный индекс 5 ПБ до репликации"
    - "Поддерживаются 100 языков и три географических региона выдачи"
