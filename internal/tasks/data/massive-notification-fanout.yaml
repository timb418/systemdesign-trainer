id: massive-notification-fanout
title: Массовая рассылка уведомлений
difficulty: 3
architecture_types:
  - notifications
  - queues
duration_min: 50
canvas: sketch
starter_diagram: diagrams/massive-notification-fanout.starter.drawio
prompt_public: |
  Текущий сервис читает всех получателей кампании из SQL и отправляет им сообщения одним worker. Спроектируйте массовый fan-out для крупных кампаний и развейте предложенный набросок.
hidden:
  functional:
    - "Создавать кампанию для сохранённого сегмента и запускать её по расписанию"
    - "Фиксировать snapshot аудитории на момент запуска"
    - "Разворачивать кампанию в персональные уведомления с шаблонными данными"
    - "Приостанавливать, возобновлять и отменять оставшуюся рассылку"
    - "Соблюдать предпочтения и лимиты частоты перед доставкой"
  nonfunctional:
    - "Кампания на 100 млн адресатов разворачивается не более чем за 20 минут"
    - "Доступность control API 99.9%, fan-out pipeline 99.95%"
    - "Повтор оркестратора не создаёт второе логическое уведомление получателю"
    - "Критические персональные сообщения не должны голодать из-за кампаний"
    - "Отмена прекращает создание новых доставок за 60 секунд"
  scale:
    - "500 млн пользователей"
    - "До 100 млн получателей в одной кампании"
    - "Пик fan-out 200 тысяч получателей в секунду"
    - "До 200 одновременно активных кампаний"
    - "20 ТБ сегментных snapshot и delivery metadata в сутки до очистки"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "кампан", "сегмент", "snapshot", "расписан", "пауз", "отмен", "предпочтен", "лимит"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "время", "доступн", "sla", "идемпот", "дубл", "приоритет", "голод", "отмен"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "пользовател", "получател", "кампан", "терабайт", "пик"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Campaign API хранит definition, template_version, segment_id, schedule, priority и state. В момент запуска Orchestrator условно переводит кампанию из scheduled в snapshotting и просит Audience Service материализовать неизменяемый список recipient_id в object storage, разбитый на нумерованные chunks с checksum и count. Это делает повтор запуска воспроизводимым и исключает изменение аудитории посередине. После готовности manifest оркестратор создаёт задания chunk_id в durable fan-out queue; уникальность campaign_id+chunk_id защищает от двойного планирования.

    Множество expand workers потоково читает chunk, проверяет актуальную остановку кампании, персонализирует только необходимые переменные и вызывает batch Decision API предпочтений и frequency caps. Для каждого разрешённого пользователя создаётся intent с детерминированным ключом campaign_id+recipient_id. Запись intent и outbox атомарна, поэтому повтор chunk безопасен. Отдельный notification pipeline выбирает канал и провайдера и непосредственно перед внешним вызовом повторяет дешёвый final suppression/preference check по свежей revision: это закрывает отписку после fan-out, пока сообщение стояло в очереди. Массовые queues имеют ограниченную долю worker capacity и token buckets по tenant, campaign и channel; транзакционные очереди используют зарезервированный пул и не голодают. Пауза прекращает leasing новых chunks, отмена записывает быстрый distributed stop flag, который workers проверяют между небольшими подбатчами.

    Progress хранится как агрегаты completed chunks, eligible, suppressed, enqueued, suppressed_at_delivery и failed, а не одна горячая строка на каждого адресата; точечный delivery status остаётся в downstream-сервисе. Lease с heartbeat возвращает зависший chunk в очередь, идемпотентность устраняет дубли. Ядовитые записи уходят в DLQ с recipient reference, не блокируя chunk. При отказе Audience Service готовый snapshot остаётся доступен, незавершённый строится заново в новой версии. Метрики включают snapshot duration, fan-out rate, oldest chunk age, per-campaign fairness, suppression reasons на обеих проверках, duplicate conflicts, stop propagation, queue saturation и прогноз завершения. Алерты обнаруживают остановившуюся кампанию, нарушение доли транзакционного трафика и расхождение manifest count с итоговыми агрегатами.
  tradeoffs:
    - "Snapshot аудитории требует места и времени, зато даёт воспроизводимость, аудит и стабильный состав кампании."
    - "Малые chunks ускоряют отмену и балансировку, но увеличивают количество сообщений и координацию."
    - "Детерминированный intent key упрощает повтор, отдельный ledger точнее показывает каждый fan-out, но дороже."
    - "Общий worker pool эффективнее, зарезервированная ёмкость защищает транзакционные уведомления от голодания."
    - "Предварительная проверка предпочтений экономит очередь, финальная повторная проверка необходима для свежей отписки."
  diagram: diagrams/massive-notification-fanout.gold.drawio
rubric_overrides:
  - "Кандидат должен зафиксировать аудиторию кампании и объяснить воспроизводимый chunk manifest."
  - "Нужна идемпотентность на уровнях запуска, chunk и recipient intent."
  - "Оценивать fairness между кампаниями и изоляцию транзакционного трафика."
  - "Пауза и отмена должны иметь измеримое время распространения."
  - "Предпочтения проверяются при fan-out и повторно непосредственно перед вызовом провайдера."
