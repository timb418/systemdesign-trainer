id: rate-limiter-distributed
title: Распределённый rate limiter
difficulty: 2
architecture_types:
  - rate_limiter
  - distributed_cache
  - api_gateway
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте общий rate limiter для множества экземпляров API в одном регионе. Лимит нельзя независимо умножать на число узлов.
hidden:
  functional:
    - "Применять единый бюджет tenant+route на всех API-узлах"
    - "Поддерживать token bucket и burst"
    - "Возвращать remaining и Retry-After"
    - "Горячо обновлять versioned policy"
    - "Выделять аварийный лимит для критичных операций"
  nonfunctional:
    - "Проверка добавляет не более 3 мс p99"
    - "Доступность решения 99.95%"
    - "Перерасход при отказе не выше 5% минутного бюджета"
    - "Policy применяется на всех узлах за 10 секунд"
    - "Отказ limiter не должен полностью остановить health-critical API"
  scale:
    - "200k API RPS через 100 узлов"
    - "5 млн активных ключей в час"
    - "Один hot tenant создаёт 15k RPS"
    - "Обычный лимит 1k RPS с burst 2k"
    - "Policy store содержит 100k правил"
