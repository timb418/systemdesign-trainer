  functional:
    - "Искать отели по датам, гостям, фильтрам и итоговой цене"
    - "Создавать краткоживущий hold на тип номера перед оплатой"
    - "Подтверждать или освобождать hold идемпотентно"
    - "Поддерживать отмену по тарифным правилам"
    - "Принимать обновления цены и доступности от отелей"
  nonfunctional:
    - "Не допускать oversell подтверждённых броней в рамках нашей квоты"
    - "Поиск p95 < 300 мс, создание hold p99 < 700 мс"
    - "Доступность поиска 99.99%, бронирования 99.95%"
    - "Hold автоматически освобождается через 10 минут"
  scale:
    - "1 млн отелей и 20 млн комбинаций room type/rate plan"
    - "Пик 100 тыс. поисков/с и 5 тыс. hold/с"
    - "Средний запрос охватывает 3 ночи, окно бронирования 400 дней"
