id: hotel-inventory-booking
title: Бронирование гостиничного инвентаря
difficulty: 3
architecture_types:
  - booking_inventory
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте платформу поиска и бронирования гостиничных номеров.
  Проясните модель инвентаря и жизненный цикл резерва.
