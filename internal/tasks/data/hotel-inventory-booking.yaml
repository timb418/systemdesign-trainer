preferred_solution:
  narrative: |
    Supplier ingestion нормализует room type, rate plan, календарь цены и выделенную платформе квоту. События с supplier_version пишутся в журнал, затем обновляют авторитетный inventory store и денормализованный search index. Поиск обращается к индексу по географии и фильтрам, получает кандидатов и рассчитывает предварительную цену; он допускает небольшое отставание и явно не резервирует номер. Перед показом checkout сервис Availability может перечитать критичные ночи из primary.

    CreateHold несёт idempotency key, offer token с hotel, room type, rate plan, датами и версией цены. Инвентарь логически шардирован по hotel_id. В одной транзакции для каждой ночи условное обновление увеличивает held только если total-sold-held остаётся положительным, затем создаётся hold со статусом PENDING и expires_at. Блокировки ночей берутся в стабильном порядке, чтобы снизить deadlock. Итоговая цена фиксируется в hold; изменившийся offer возвращает новый расчёт, а не молча списывает больше. Payment выполняется вне транзакции инвентаря.

    После успеха платежа ConfirmHold идемпотентно переводит held в sold и создаёт booking. Saga пишет outbox: если подтверждение окончательно не прошло, платёж получает refund; если клиент исчез, expiration worker освобождает hold условным переходом PENDING→EXPIRED. Гонки confirm и expiry решает compare-and-set статуса, поэтому ресурс меняет счётчик ровно один раз. Таймеры строятся на durable delayed queue плюс периодическом сканере просроченных записей. Отмена проверяет тариф, изменяет booking и возвращает sold в доступность только там, где наша квота допускает.

    Горячие популярные отели изолируются отдельными шардами, а поисковый трафик масштабируется независимо. При отставании supplier feed продажи ограничиваются safety buffer; при недоступности inventory checkout прекращается, хотя поиск продолжает работать. Метрики включают search latency, stale offers, hold conflict, conversion, expiry lag, held/sold invariant, payment compensation и supplier lag. Алерты ловят отрицательную доступность, зависшие hold, рост price mismatch и DLQ; trace_id связывает offer, hold, payment и booking.
  tradeoffs:
    - "Инвентарь по конкретным комнатам vs счётчик room type: счётчик масштабируется, назначение комнаты откладывается."
    - "Транзакция всех ночей vs saga по ночам: транзакция сохраняет целостность поездки, но расширяет блокировки."
    - "Синхронный supplier check vs локальная квота: проверка свежее, локальная квота даёт предсказуемый latency."
    - "Hold до платежа vs платёж до hold: hold защищает покупателя, но временно снижает доступный инвентарь."
    - "Точный TTL-таймер vs сканирование: таймер быстрее освобождает, сканер надёжно закрывает пропуски."
  diagram: diagrams/hotel-inventory-booking.gold.drawio
rubric_overrides:
  - "Нужно атомарно проверять доступность всех ночей, а не только суммарное число."
  - "Гонка ConfirmHold и expiry должна решаться условным переходом статуса."
  - "Цена обязана фиксироваться в offer/hold с обнаружением устаревшей версии."
  - "Платёж и inventory требуют saga и явной компенсации."
