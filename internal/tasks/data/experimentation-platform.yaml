id: experimentation-platform
title: Платформа A/B-экспериментов
difficulty: 4
architecture_types:
  - metrics
  - key_value_store
  - queues
duration_min: 70
canvas: blank
prompt_public: |
  На доске показан сервис фичефлагов и таблица событий. Превратите их в платформу контролируемых A/B-экспериментов.
  Уточните требования к назначению вариантов, метрикам и достоверности результата.
hidden:
  functional:
    - "Создание эксперимента, вариантов, аудитории и расписания"
    - "Стабильное назначение пользователя в вариант и mutual exclusion namespaces"
    - "Доставка конфигурации SDK и аварийный kill switch"
    - "Сбор exposure и outcome событий"
    - "Расчёт метрик, guardrails, confidence intervals и отчёта"
    - "Постепенный rollout победившего варианта"
  nonfunctional:
    - "Assignment p99 < 10 мс локально в SDK и доступен при потере control plane"
    - "Один субъект стабильно получает вариант для версии эксперимента"
    - "Exposure учитывается только при фактическом показе, а не при assignment"
    - "Отчёт воспроизводим по snapshot конфигурации и версии metric definition"
    - "SRM и нарушение guardrail обнаруживаются не позже 15 минут"
  scale:
    - "50k активных экспериментов и 5k изменений конфигурации/с"
    - "500 млн DAU и 20 млн assignment checks/с"
    - "3 млн exposure/с и 15 млн outcome events/с"
    - "10k metric definitions, окна от часа до 90 дней"
    - "5 лет raw events, около 1 ПБ в день до сжатия"
