preferred_solution:
  narrative: |
    Route API принимает origin, destination, departure_time и ограничения. Map Matcher привязывает координаты к допустимым рёбрам дорожного графа. Routing workers держат региональные partitions графа в памяти и используют A*/contraction hierarchies для нескольких candidate paths. Базовый вес ребра берётся из исторического профиля скорости для дня и пятнадцатиминутного окна, затем корректируется свежим traffic overlay и closures. ETA Model суммирует ожидаемые времена и применяет признаки поворотов, погоды и класса дороги, возвращая duration, confidence, route_version и основные причины отклонения. Качество измеряется MAPE только на поездках 10–60 минут, а для коротких поездок — абсолютной ошибкой, чтобы малый знаменатель не искажал SLO.

    GPS probes поступают в региональный ingest с event_time, quality и анонимным source id. Stream processing выполняет map matching, удаляет выбросы, агрегирует скорости по road_segment и окну, учитывает sample count и публикует versioned overlay в компактном KV/pub-sub. Routing nodes подписываются на deltas и атомарно меняют локальный snapshot; watermark и age доступны каждому ответу. Перекрытия из доверенного источника имеют приоритет и отдельный быстрый канал. Исторические профили и модель регулярно пересчитываются offline, проходят replay evaluation и выкатываются canary.

    Для активной поездки клиент отправляет позицию и previous_route_id. Если машина остаётся на коридоре маршрута, Fast ETA path пересчитывает оставшиеся веса без полного поиска; при отклонении запускается reroute. Состояние сессии хранит последнюю sequence и route version, поэтому поздний GPS не откатывает прогресс. Регионы графа реплицируются, запросы на границе координируют ограниченное число partitions; при устаревшем live overlay сервис возвращает ETA на истории с quality flag. Наблюдаемость разделяет system latency и model quality: overlay lag, unmatched GPS, route expansions, cache hit, p99, absolute percentage error по завершённым поездкам, bias по городу/времени, reroute rate и closure propagation. Алерты срабатывают на свежесть и сильный региональный bias, даже если API формально здоров.
  tradeoffs:
    - "Dijkstra точен и прост, A*/contraction hierarchies резко быстрее ценой сложной подготовки и обновления весов."
    - "Полный live graph точнее, overlay поверх стабильной топологии быстрее распространяется и проще откатывается."
    - "Частые GPS probes дают свежесть, но увеличивают стоимость и privacy-риск; агрегация уменьшает оба."
    - "Полный reroute на каждом update точнее, corridor fast path удерживает 200 мс и снижает CPU."
    - "Одна глобальная модель проще, региональная калибровка уменьшает bias ценой эксплуатации множества версий."
    - "Процентная ошибка сравнима для обычных поездок, но нестабильна на коротких; для них нужен отдельный абсолютный порог."
  diagram: diagrams/eta-service.gold.drawio
rubric_overrides:
  - "Кандидат должен разделить стабильный дорожный граф, исторические веса и свежий traffic overlay."
  - "Оценивать ETA не только latency, но и ошибкой по завершённым поездкам и региональным bias."
  - "Нужен быстрый путь обновления активной поездки без полного reroute."
  - "Метрика качества должна явно различать percentage error обычных поездок и absolute error коротких."
