id: cdn-origin-delivery
title: Origin для CDN-раздачи
difficulty: 3
architecture_types:
  - object_storage
  - distributed_cache
  - api_gateway
duration_min: 50
canvas: blank
prompt_public: |
  Спроектируйте origin и контур доставки статических объектов через CDN: cache miss, invalidation, signed access и защита от origin overload.
