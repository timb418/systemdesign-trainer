preferred_solution:
  narrative: |
    API принимает lat/lon, radius либо viewport, category filters, open_at и page_token. Gateway ограничивает максимальную область, округляет координаты в access log и передаёт запрос Nearby Service. Координата переводится в набор S2 или H3 cells подходящего уровня; сервис расширяет кольца до покрытия радиуса и запрашивает cell index. Индекс хранит place_id и координаты, а Place Store — название, категорию, рейтинг, timezone, расписание и revision. Кандидаты сначала отбираются по ячейкам, затем точное расстояние считается формулой haversine, поэтому пограничные места не теряются.

    Metadata-фильтры применяются до либо после точного расстояния в зависимости от селективности. Признак open now вычисляется по локальной timezone и версионированному расписанию; сложные праздничные исключения кэшируются отдельно. Ranking сочетает расстояние и популярность, но API возвращает и физическое distance. Для первой страницы Nearby Service открывает point-in-time index generation с ограниченным TTL; cursor фиксирует query hash, generation и последнюю пару score/place_id. Старые immutable generations удерживаются на срок жизни cursor, поэтому обновления индекса не создают повторов между страницами. Срочно закрытые места всё равно удаляются финальным suppression check, даже если generation старая. Для очень широкого viewport выбираются более крупные клетки и возвращаются кластеры либо ограниченный top-K.

    Place Write API сохраняет канонический объект в SQL/KV, а outbox направляет revision в indexer. Новые записи допускают десятиминутный lag. Закрытие одновременно помещает place_id в быстрый suppression cache, который проверяется перед ответом, и затем обновляет индекс. Геоиндекс реплицируется по регионам, горячие city cells дробятся виртуальными buckets и кэшируются; stateless query workers масштабируются по QPS. При отказе metadata store можно вернуть ограниченную карточку из денормализованного index document, но suppression остаётся обязательным. Метрики включают p99, число покрытых cells, candidate count, exact-distance work, cache hit, empty results, index lag, suppression age и hot-cell skew. Контрольные запросы вдоль границ ячеек обнаруживают ошибки покрытия, а privacy-аудит проверяет отсутствие точных координат в логах и трассах.
  tradeoffs:
    - "Geohash прост, S2/H3 лучше управляют соседями и уровнями, но требуют аккуратного покрытия границ."
    - "Мелкие ячейки уменьшают кандидатов, зато увеличивают fan-out для большого радиуса."
    - "Сортировка только по расстоянию понятна, смешанный score полезнее, но требует стабильного cursor."
    - "Расписание в индексе ускоряет open-now, отдельный Place Store проще обновляет сложные исключения."
    - "Точный lat/lon полезен диагностике, округление и sampling уменьшают риск утечки местоположения."
    - "Point-in-time generation стабилизирует cursor, но требует удерживать старые сегменты; suppression имеет приоритет над snapshot."
  diagram: diagrams/nearby-places-search.gold.drawio
rubric_overrides:
  - "Кандидат должен сделать грубый геоотбор и затем точную проверку расстояния."
  - "Оценивать границы ячеек, выбор resolution и hotspot популярных районов."
  - "Закрытие места требует быстрого suppression path помимо обычной индексации."
  - "Cursor должен ссылаться на реально удерживаемую point-in-time generation, а не только содержать номер revision."
