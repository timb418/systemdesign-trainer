id: autocomplete-search
title: Автодополнение поисковых запросов
difficulty: 2
architecture_types:
  - search
  - distributed_cache
duration_min: 35
canvas: blank
prompt_public: |
  Спроектируйте автодополнение для строки поиска: после ввода нескольких символов пользователь видит подходящие запросы. Опишите основную архитектуру и начните с уточнений.
hidden:
  functional:
    - "Возвращать до 10 популярных подсказок по введённому префиксу"
    - "Учитывать язык и регион пользователя"
    - "Обновлять популярность подсказок по поисковым событиям"
    - "Фильтровать запрещённые и персональные данные из подсказок"
    - "Поддерживать удаление подсказки службой модерации"
  nonfunctional:
    - "p99 ответа API не более 100 мс"
    - "Доступность чтения 99.95%"
    - "Допустима задержка обновления популярности до 10 минут"
    - "Результат для одинакового префикса в регионе должен быть стабильным в течение минуты"
    - "Отказ аналитического контура не должен останавливать выдачу подсказок"
  scale:
    - "20 млн DAU"
    - "Пик 60 тысяч запросов подсказок в секунду"
    - "500 млн поисковых событий в сутки"
    - "30 млн активных фраз, средняя длина 35 байт"
    - "Поддерживаются 20 языков и 50 регионов"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "подсказк", "язык", "регион", "модерац", "фильтр", "персонал"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "свежест", "консистент", "отказ"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "dau", "масштаб", "событ", "объём", "язык"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Клиент вызывает GET /v1/suggestions?prefix=&locale=&region= через ближайший API Gateway; сервис нормализует регистр, Unicode и раскладку, проверяет минимальную длину и формирует ключ локали. Горячий путь чтения не обращается к сырым событиям. Для каждого языка и региона подготовлен компактный префиксный индекс: trie или FST хранит верхние кандидаты и их score прямо в узлах. Неизменяемые сегменты индекса размещаются в объектном хранилище, загружаются поисковыми узлами в память, а самые частые префиксы дополнительно кэшируются в Redis и на edge.

    Поисковые клики и отправленные запросы публикуются в журнал событий. Потоковая агрегация считает популярность по окнам и подавляет ботов. Кандидат допускается в индекс только после k-anonymity/минимального числа независимых пользователей, PII-классификатора и фильтров телефонов, email, адресов, секретов и запрещённых тем: одна лишь редкость не считается достаточной защитой. Периодический builder объединяет безопасные счётчики с предыдущей версией, рассчитывает score с временным затуханием, строит новый сегмент и атомарно переключает manifest. Поэтому читатели видят целую версию, а не частично обновлённый trie; десятиминутная eventual consistency здесь приемлема. Срочное удаление попадает также в глобальный deny-list, который API проверяет после Redis/FST lookup и перед ответом, включая fallback на старую версию.

    Чтение горизонтально масштабируется по locale/region, узлы остаются stateless относительно запросов и держат несколько последних индексов для отката. При промахе Redis запрос обслуживается из локальной памяти, поэтому отказ кэша повышает нагрузку, но не ломает функцию. При сбое builder продолжает работать последняя корректная версия. Метрики включают p50/p99, hit ratio, долю пустых результатов, возраст manifest, размер индекса, ошибки нормализации и частоту блокировок. Трассировка связывает gateway и suggestion service, а алерты контролируют SLA, отставание агрегации и расхождение контрольных запросов между версиями.
  tradeoffs:
    - "Trie проще обновлять, FST компактнее и быстрее читает неизменяемый словарь, но требует пакетной пересборки."
    - "Предрасчёт top-K в каждом узле увеличивает индекс, зато исключает дорогой обход поддерева на каждом запросе."
    - "Redis снижает CPU для горячих префиксов, но локальный in-memory индекс даёт устойчивый fallback без сетевого hop."
    - "Потоковые обновления свежее, пакетный manifest обеспечивает атомарность и более простое восстановление."
    - "Единый мировой рейтинг дешевле, раздельные locale/region индексы заметно релевантнее."
    - "Высокий k-anonymity threshold лучше защищает приватность, но убирает полезные редкие запросы; PII-фильтры нужны независимо от порога."
  diagram: diagrams/autocomplete-search.gold.drawio
rubric_overrides:
  - "Кандидат должен предложить префиксный индекс и объяснить, почему запрос не сканирует полный словарь."
  - "Кандидат должен разделить контуры сбора популярности, сборки версии и низколатентной выдачи."
  - "Отдельно оценивать защиту от утечки персональных и запрещённых фраз."
  - "Защита должна сочетать k-anonymity, PII-фильтрацию и deny-check на всех путях выдачи."
