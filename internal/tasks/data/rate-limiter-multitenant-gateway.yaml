    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Контракт и границы.
    Gateway формирует canonical tuple tenant/key/route/cost и вызывает CheckMany; ответ возвращает самое ограничивающее правило, remaining и reset.
    Admin override подписан, ограничен scope и TTL; quota endpoint показывает только данные tenant.
    Модель данных.
    Policy graph связывает plan, tenant override, key и route.
    Decision transaction списывает несколько bucket IDs с общим request_id.
    Неизменяемый usage ledger хранит allowed cost, policy_version, region и billing dimension.
    Основные потоки.
    Локальные leases уменьшают remote checks, но hierarchical consume выполняется атомарно в regional limiter.
    Global dependency quota выдаёт регионам budget slices; allocator перераспределяет их по demand.
    До ответа gateway limiter фиксирует decision в локальном replicated WAL/outbox; relay отправляет его в durable usage log, а reconciliation сверяет sequence gaps.
    Масштабирование.
    Tenant keys хешируются, virtual shards и admission защищают от noisy neighbor.
    Hot enterprise tenant получает выделенный shard без изменения semantics.
    Региональные slices обновляются чаще при быстром росте и имеют bounded emergency reserve.
    Согласованность.
    Все вложенные buckets либо списаны одной транзакцией, либо ни один.
    Глобальная quota приблизительна в пределах региональных slices; policy_version и epoch аннулируют старые leases.
    Ledger дедуплицирует request_id при повторной доставке; per-shard sequence позволяет обнаружить пропуск и переиграть WAL.
    Отказы и восстановление.
    При отказе shard gateway использует короткий conservative lease только для безопасных reads; денежные операции закрываются.
    Застрявший global allocator не продлевает slice выше floor.
    Override автоматически истекает и оставляет audit event.
    Наблюдаемость.
    Наблюдаются deny по policy level, fairness внутри tenant, shard saturation, slice utilization, lease overshoot, policy lag и полнота ledger.
    High-cardinality tenants доступны через traces/exemplars, а не постоянные labels.
    Практические решения.
    Weighted fair sharing применяется только к избытку, базовые договорные квоты остаются предсказуемыми.
    Billing pipeline сверяет непрерывность sequence и ledger с gateway samples; purchased credits списываются только по дедуплицированным allowed decisions.
    Capacity тест моделирует tenant с 60k RPS и массовую ротацию ключей.
  tradeoffs:
    - "Атомарная иерархия против последовательных проверок: корректность против latency"
    - "Региональные slices против глобального check: доступность против overshoot"
    - "Общий shard против dedicated shard крупного tenant"
    - "Leases против точного usage billing"
    - "Fair sharing против простых статических квот"
  diagram: diagrams/rate-limiter-multitenant-gateway.gold.drawio
rubric_overrides:
  - "Оценивается атомарное списание всех уровней quota"
  - "Нужна защита от noisy neighbor и hot tenant"
  - "Кандидат должен различать enforcement и billing ledger"
  - "Глобальный бюджет требует количественно ограниченного regional overshoot"
  - "Override обязан иметь scope, TTL и аудит"
