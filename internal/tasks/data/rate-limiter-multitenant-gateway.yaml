id: rate-limiter-multitenant-gateway
title: Мультитенантный limiter API Gateway
difficulty: 3
architecture_types:
  - rate_limiter
  - api_gateway
  - payments
duration_min: 55
canvas: blank
prompt_public: |
  Спроектируйте rate limiting в SaaS API Gateway: разные тарифы, вложенные квоты и защита от noisy neighbor.
hidden:
  functional:
    - "Проверять одновременно tenant, API key, route и global dependency quota"
    - "Поддерживать тарифные планы и purchased burst credits"
    - "Справедливо делить остаток между ключами tenant"
    - "Показывать клиенту quota headers и reason code"
    - "Давать support безопасный временный override"
  nonfunctional:
    - "Overhead p99 менее 5 мс"
    - "Один tenant не потребляет более 30% capacity общего shard; более крупный tenant переводится на dedicated shard"
    - "Изменение плана действует за 15 секунд"
    - "Биллинг usage теряет не более 0.01% решений"
    - "Нельзя раскрывать лимиты соседних tenants"
  scale:
    - "1 млн tenants, 50 млн API keys"
    - "Глобально 500k RPS через 20 региональных gateway-кластеров"
    - "Крупнейший tenant даёт 60k RPS"
    - "До 4 иерархических buckets проверяются на запрос"
    - "Usage ledger хранится 400 дней"
reveal_on_question:
  - id: functional
    keywords: ["иерархические квоты", "tariff plan", "burst credits", "fair sharing", "support override"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["gateway overhead", "noisy neighbor", "plan propagation", "billing completeness", "tenant isolation"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
