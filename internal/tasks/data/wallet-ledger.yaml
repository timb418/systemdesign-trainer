id: wallet-ledger
title: Кошелёк и двойная бухгалтерия
difficulty: 4
architecture_types:
  - payments
  - key_value_store
duration_min: 70
canvas: blank
prompt_public: |
  Спроектируйте внутренний кошелёк: пользователи пополняют баланс, переводят деньги друг другу и выводят средства.
  Уточните финансовые инварианты и модель хранения.
hidden:
  functional:
    - "Пополнение, перевод между кошельками и вывод средств"
    - "Авторизация суммы с последующим capture или release"
    - "Получение доступного и бухгалтерского баланса и истории"
    - "Идемпотентная обработка клиентских команд и provider webhooks"
    - "Reversal корректирующей проводкой без удаления исходной"
  nonfunctional:
    - "Сумма всех дебетов равна сумме всех кредитов в каждой транзакции"
    - "Баланс не уходит ниже нуля для кошельков без кредитного лимита"
    - "Линеаризуемые денежные переходы, подтверждённая проводка не теряется"
    - "p99 внутреннего перевода < 300 мс, доступность записи 99.99%"
    - "Неизменяемый аудит 10 лет и ежедневная сверка с провайдерами"
  scale:
    - "100 млн кошельков и 20 млн активных в день"
    - "Средняя нагрузка 50k транзакций/с, пик 200k/с"
    - "До 20 валют, отдельный ledger на валюту без скрытой конвертации"
    - "500 млрд postings за 10 лет, около 100 ТБ индексов"
    - "Горячий merchant-кошелёк получает 10k операций/с"
