id: reverse-proxy-gateway
title: Шлюз обратного прокси
difficulty: 1
architecture_types:
  - api_gateway
  - rate_limiter
duration_min: 25
canvas: blank
prompt_public: |
  Спроектируйте единый шлюз перед несколькими HTTP-сервисами интернет-магазина.
  Начните с уточнения обязанностей шлюза и ожидаемой нагрузки.
hidden:
  functional:
    - "Маршрутизировать запрос по host, path и HTTP-методу к нужному backend"
    - "Завершать TLS и передавать проверенный контекст пользователя внутренним сервисам"
    - "Ограничивать частоту запросов по API-ключу и IP"
    - "Выполнять health checks, балансировку и исключение нездоровых экземпляров"
    - "Добавлять request ID, нормализовать служебные заголовки и ограничивать размер тела"
  nonfunctional:
    - "Дополнительная задержка шлюза p99 < 15 мс"
    - "Доступность шлюза 99.95% без единой точки отказа"
    - "Конфигурация маршрутов применяется ко всем экземплярам не позднее чем за 30 секунд"
    - "Шлюз не должен доверять входящим служебным заголовкам идентичности"
    - "Повтор запроса допустим только для безопасных методов или при наличии ключа идемпотентности"
  scale:
    - "Пик входящего трафика — 25 тыс. RPS, среднее — 8 тыс. RPS"
    - "60 маршрутов ведут к 15 backend-сервисам и примерно 300 экземплярам"
    - "Среднее тело запроса 4 КБ, максимальное — 2 МБ"
    - "Около 70% запросов аутентифицированы; 5% используют API-ключи партнёров"
    - "Один экземпляр шлюза устойчиво обслуживает 3 тыс. RPS при целевой загрузке CPU 60%"
reveal_on_question:
  - id: scale
    keywords: ["qps", "rps", "нагрузк", "трафик", "маршрут", "сервис", "размер", "масштаб"]
    reveal: ["hidden.scale"]
  - id: functional
    keywords: ["функционал", "требования", "маршрутиз", "tls", "балансир", "health", "лимит", "заголов"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["latency", "задержк", "доступн", "sla", "безопас", "конфигурац", "retry", "повтор", "идемпот"]
    reveal: ["hidden.nonfunctional"]
preferred_solution:
  narrative: |
    Клиент подключается по HTTPS к L4-балансировщику, который распределяет соединения между
    несколькими stateless-экземплярами gateway в разных зонах доступности. Gateway завершает
    TLS, назначает или валидирует X-Request-ID, удаляет все внешние X-User-* заголовки и
    проверяет сессию либо API-ключ через локально кэшируемые данные сервиса идентификации.
    Только после успешной проверки он создаёт подписанный внутренний контекст пользователя.
    Публичные маршруты явно отмечены в конфигурации: отсутствие правила означает запрет, а не
    неявный доступ.

    Таблица маршрутов сопоставляет host, нормализованный path и метод с кластером backend,
    правилами аутентификации, лимитом тела, таймаутом и политикой rate limit. Control plane
    проверяет новую версию, сохраняет её в версионированном хранилище и рассылает уведомление.
    Каждый gateway сначала загружает полную консистентную версию, затем атомарно переключает
    указатель; частично применённой таблицы быть не должно. Service discovery предоставляет
    адреса экземпляров, а активные и пассивные health checks временно исключают сбойные цели.
    Балансировка least-connections подходит при разной длительности запросов лучше простого
    round robin.

    Ограничитель использует локальную token bucket для грубой защиты каждого процесса и Redis
    для общего лимита партнёрского API-ключа. Если Redis недоступен, чувствительные партнёрские
    операции закрываются, а обычный пользовательский трафик получает сниженный локальный лимит.
    Gateway задаёт отдельные connect, response-header и общий timeout. Он может один раз
    повторить GET на другом здоровом экземпляре, только если первый не вернул заголовки.
    POST не повторяется без idempotency key, поскольку неизвестный результат мог уже изменить
    заказ. Ответы не кэшируются в базовой версии, чтобы шлюз не стал владельцем прикладной
    семантики.

    При падении backend circuit breaker ограничивает новые обращения и периодически пропускает
    пробные запросы. Исчерпание очереди или пула соединений быстро возвращает 503 вместо
    накопления запросов до глобального таймаута. Экземпляры gateway автоматически масштабируются
    по RPS, активным соединениям и CPU с запасом на потерю зоны. Дренирование соединений перед
    остановкой уменьшает ошибки во время выкладки.

    Наблюдаемость включает RPS, p50/p95/p99 добавленной задержки, коды ответов по route_id,
    число активных целей, срабатывания лимитов, timeout, retry и circuit breaker. Метрики не
    используют path с идентификатором заказа как label. Структурный access log содержит
    request_id, route_id, backend, статус и длительность, но удаляет cookie, Authorization и
    персональные данные. Распределённая трассировка пробрасывает стандартный trace context,
    позволяя отличить задержку самого шлюза от backend. Алерты реагируют на исчерпание capacity,
    рассинхронизацию версий маршрутов и рост 502/503 по конкретному кластеру.
  tradeoffs:
    - "L4-балансировщик перед gateway vs прямой DNS: L4 упрощает health checking и zonal failover ценой дополнительного перехода."
    - "Локальный vs централизованный rate limit: локальный быстрее, Redis обеспечивает общий лимит, но добавляет зависимость."
    - "Round robin vs least-connections: round robin проще, least-connections лучше учитывает долгие запросы."
    - "Retry на gateway vs только в клиенте: шлюз скрывает краткий сбой, но может усилить нагрузку и дублировать изменения."
    - "Push vs polling конфигурации: push быстрее распространяет изменения, периодический polling восстанавливает пропущенные события."
    - "Fail open vs fail closed при сбое авторизации: открытие сохраняет доступность ценой критического нарушения границы доверия."
  diagram: diagrams/reverse-proxy-gateway.gold.drawio
rubric_overrides:
  - "Кандидат должен явно удалить недоверенные заголовки идентичности до добавления внутренних."
  - "Оценивается безопасная политика retry с учётом метода, момента сбоя и идемпотентности."
  - "Высокий балл требует атомарного и наблюдаемого распространения версий конфигурации."
  - "Нужно различить health checking, балансировку и circuit breaker как разные механизмы."
