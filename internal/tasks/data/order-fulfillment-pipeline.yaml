id: order-fulfillment-pipeline
title: Пайплайн исполнения заказа
difficulty: 3
architecture_types:
  - ecommerce
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте пайплайн от оплаченного заказа до отгрузки и доставки.
  Определите владельцев состояния и обработку частичных отказов.
hidden:
  functional:
    - "Принять оплаченный заказ и распределить строки по складам"
    - "Резервировать товар, создавать задания pick-pack-ship и отправления"
    - "Поддерживать частичную отгрузку и отмену неисполненных строк"
    - "Показывать пользователю историю статусов заказа"
    - "Компенсировать оплату или резерв при окончательном отказе"
  nonfunctional:
    - "Ни одна строка заказа не отгружается дважды"
    - "99% оплаченных заказов поступают на склад за 2 минуты"
    - "Пайплайн доступен 99.95% и переживает повторную доставку событий"
    - "История статусов аудируема и не переписывается задним числом"
  scale:
    - "5 млн заказов в сутки, пик 20 тыс. заказов/с"
    - "Средний заказ содержит 4 строки и затрагивает 1.3 склада"
    - "300 складов, до 300 тыс. warehouse events/с, включая отдельные picked/packed/shipped переходы строк"
    - "2% строк требуют перераспределения, 0.5% заказов отменяются после оплаты"
