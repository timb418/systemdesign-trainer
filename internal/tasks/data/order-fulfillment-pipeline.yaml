preferred_solution:
  narrative: |
    Order Service является владельцем агрегата заказа: строки имеют независимые состояния, а order status вычисляется из них. После подтверждения платежа идемпотентная команда с payment_id в транзакции переводит заказ в PAID и пишет событие в outbox. Брокер партиционирует события по order_id, сохраняя порядок одного агрегата. Fulfillment orchestrator читает событие, фиксирует собственный workflow state и выбирает склады по доступности, расстоянию, стоимости и возможности уменьшить число отправлений.

    Для каждого склада orchestrator отправляет ReserveInventory с operation_id. Inventory Service атомарно резервирует доступное количество и возвращает reservation_id; повтор команды возвращает прежний ответ. Если часть строк не помещается, политика пробует следующий склад ограниченное число раз. После набора резервов создаются immutable fulfillment units. Warehouse adapter через transactional outbox передаёт задания WMS, а входящие picked, packed и shipped events дедуплицируются по source_event_id и проверяются state machine. Один unit может породить отдельное shipment; пользовательская проекция собирает ordered status history и tracking numbers.

    Это saga, а не распределённая транзакция. До начала picking окончательный отказ освобождает успешные резервы и инициирует полный или частичный refund. После отгрузки компенсация превращается в возврат, а не отмену. Timeout означает UNKNOWN: orchestrator сначала запрашивает результат по operation_id, прежде чем послать компенсирующую команду. Inbox/outbox и уникальные business keys дают effectively-once эффект поверх at-least-once брокера; audit log остаётся append-only.

    Шардинг workflow store по order_id и отдельные consumer groups каждой стадии масштабируют пик. Backpressure WMS не должен блокировать приём заказов, но age оплаченного заказа измеряется и алертится до двух минут. Poison messages попадают в DLQ с инструментом безопасного replay, circuit breaker изолирует проблемный склад. Метрики включают stage age, retry, reservation failures, split shipments, compensation, state-transition rejects, outbox lag и end-to-end lead time. Трасса связывает order, line, reservation, fulfillment unit, shipment и refund.
  tradeoffs:
    - "Оркестрация vs хореография: orchestrator делает saga видимой, но становится критичным владельцем workflow."
    - "Минимум складов vs ближайшая отгрузка: консолидация снижает стоимость, распределение ускоряет доставку."
    - "Один статус заказа vs статусы строк: один проще клиенту, строки нужны для частичного исполнения."
    - "Синхронный WMS API vs события: API проще запрос-ответ, события переживают долгие операции и разрывы."
    - "Автоматическая компенсация vs ручная проверка UNKNOWN: автомат быстрее, но опасна без подтверждения исхода."
  diagram: diagrams/order-fulfillment-pipeline.gold.drawio
rubric_overrides:
  - "Ожидается явная saga с durable workflow state, а не цепочка незапоминаемых consumers."
  - "Каждая внешняя команда должна иметь business operation id и запрос результата после timeout."
  - "Частичная отгрузка моделируется на уровне строк или fulfillment units."
  - "Аудит статусов должен быть append-only и отделён от пользовательской проекции."
