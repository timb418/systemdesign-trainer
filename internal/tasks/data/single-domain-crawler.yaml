id: single-domain-crawler
title: Краулер одного домена
difficulty: 2
architecture_types:
  - crawler
duration_min: 35
canvas: blank
prompt_public: |
  Спроектируйте краулер для регулярного обхода одного крупного сайта.
  Уточните требования и объясните основной поток обработки.
hidden:
  functional:
    - "Начинать обход с набора seed URL и находить внутренние ссылки"
    - "Соблюдать robots.txt и ограничение частоты запросов владельца"
    - "Нормализовать URL и не скачивать одну страницу повторно в рамках обхода"
    - "Сохранять HTML, HTTP-метаданные и время последнего успешного обхода"
  nonfunctional:
    - "Не более 20 запросов в секунду к домену"
    - "95% доступных страниц должны быть обработаны за 5 суток"
    - "После перезапуска потеря прогресса не превышает 1 минуты"
    - "Повторная доставка задания допустима, итоговое сохранение должно быть идемпотентным"
  scale:
    - "До 8 млн уникальных URL на домене"
    - "Средний HTML-ответ 120 КБ"
    - "Около 15% запросов завершаются редиректом или ошибкой"
    - "Полный обход запускается раз в 7 дней, изменившиеся разделы — ежедневно"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "требован", "robots", "сохраня", "ссылк"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["задерж", "доступн", "надёж", "идемпот", "ограничен", "sla"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["масштаб", "нагруз", "qps", "rps", "страниц", "объём", "сколько"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    API управления принимает seed URL и параметры запуска, проверяет принадлежность домену и создаёт запись обхода. Планировщик кладёт URL во фронтир с временем следующей допустимой загрузки. Отдельный диспетчер читает готовые элементы, но token bucket на домен жёстко удерживает двадцать запросов в секунду. Перед каждым соединением fetcher повторно разрешает DNS, отклоняет loopback, link-local, private и metadata-адреса и заново проверяет каждый redirect, защищаясь от SSRF и DNS rebinding. Воркеры загружают robots.txt с TTL, выполняют HTTP-запрос, ограничивают размер ответа и передают HTML парсеру. Парсер извлекает ссылки, приводит схему и host к каноническому виду, удаляет fragment, аккуратно обрабатывает query-параметры и оставляет только внутренние адреса.

    Таблица URL содержит нормализованный ключ, статус, число попыток, discovered_at, last_crawled_at и content hash. Уникальный индекс делает повторную постановку безопасной. HTML и крупные ответы хранятся в объектном хранилище, метаданные — в реляционной БД; очередь допускает at-least-once. Воркер подтверждает сообщение только после идемпотентной фиксации результата и найденных ссылок. Таймауты, экспоненциальный backoff и отдельная очередь исчерпанных попыток защищают от временных 429, 5xx и сетевых сбоев. Постоянные 404 помечаются без агрессивных повторов, редиректы имеют ограничение длины цепочки.

    Одного логического шарда достаточно, но воркеры можно горизонтально масштабировать, не нарушая общий rate limit. Контрольный процесс восстанавливает зависшие lease после падения. Наблюдаемость включает глубину фронтира, возраст старейшего URL, коды HTTP, latency, байты, долю дублей, ошибки парсера и успешное покрытие. Алерты срабатывают при остановке прогресса, росте 429 и приближении срока пять суток; трассировка связывает URL с попыткой и объектом результата.
  tradeoffs:
    - "Реляционный фронтир vs брокер: БД проще для дедупликации и восстановления, брокер лучше держит поток воркеров."
    - "Точная каноникализация query vs риск дублей: агрессивное удаление параметров экономит обход, но может склеить разные страницы."
    - "HTML в БД vs object storage: транзакционность удобнее в БД, объектное хранилище дешевле для сотен гигабайт."
    - "Строгий обход по слоям vs приоритетный фронтир: BFS предсказуем, приоритеты быстрее обновляют важные разделы."
  diagram: diagrams/single-domain-crawler.gold.drawio
rubric_overrides:
  - "Кандидат обязан выделить глобальный для домена rate limiter, а не лимит на каждый воркер."
  - "Дедупликация должна опираться на нормализованный URL и переживать перезапуск."
  - "Нужно объяснить подтверждение задания только после сохранения результата."
