id: change-detection-crawler
title: Краулер обнаружения изменений
difficulty: 3
architecture_types:
  - crawler
duration_min: 45
canvas: blank
prompt_public: |
  Спроектируйте сервис, который отслеживает изменения страниц на множестве сайтов.
  Начните с вопросов к заказчику.
hidden:
  functional:
    - "Пользователь добавляет URL и получает события о содержательных изменениях"
    - "Поддерживать настраиваемую частоту проверки от 5 минут до суток"
    - "Игнорировать заданные CSS-селекторы и динамические блоки"
    - "Хранить текущую и предыдущую версии и краткое текстовое различие"
    - "Отправлять webhook с повторными попытками"
  nonfunctional:
    - "99% проверок стартуют не позже чем через 2 минуты от расписания"
    - "Не превышать индивидуальные robots.txt и per-host лимиты"
    - "Ложные уведомления из-за перестановки разметки — менее 1%"
    - "Событие изменения доставляется webhook at-least-once и имеет стабильный event_id"
  scale:
    - "20 млн активных URL"
    - "В среднем 4 проверки URL в сутки, пик 3 тыс. загрузок/с"
    - "Средний ответ 300 КБ, 2% страниц требуют headless-браузер"
    - "Около 5% успешных проверок обнаруживают содержательное изменение"
reveal_on_question:
  - id: functional
    keywords: ["функционал", "требован", "уведом", "верс", "diff", "селектор"]
    reveal: ["hidden.functional"]
  - id: nonfunctional
    keywords: ["sla", "задерж", "точност", "ложн", "надёж", "достав", "robots"]
    reveal: ["hidden.nonfunctional"]
  - id: scale
    keywords: ["масштаб", "нагруз", "qps", "rps", "url", "страниц", "сколько", "объём"]
    reveal: ["hidden.scale"]
preferred_solution:
  narrative: |
    Публичный API создаёт подписку с URL, периодом, правилами исключения и webhook, а таблица подписок хранит next_check_at и версию конфигурации. При создании система проверяет, что запрошенная частота укладывается в robots.txt и доступную долю per-host бюджета; невыполнимое расписание отклоняется или получает более редкий effective period. URL страницы и webhook проходят allowlist схем, ограничение портов и DNS-проверку; перед каждым соединением и redirect повторно отклоняются loopback, link-local, private и metadata-адреса, чтобы закрыть SSRF и DNS rebinding. Распределённый планировщик выбирает наступившие интервалы по временным бакетам, атомарно выдаёт короткий lease и публикует задания в очередь. Диспетчер группирует их по host, применяет robots.txt и общий token bucket, чтобы тысячи воркеров не превратили независимые лимиты в атаку на сайт. Обычные HTTP-воркеры обслуживают большинство страниц; дорогой пул headless-браузеров получает только подписки, для которых рендеринг действительно необходим.

    После загрузки нормализатор удаляет выбранные DOM-узлы, scripts, случайные идентификаторы и лишние пробелы, затем строит стабильное текстовое представление и hash. Совпадение hash завершает проверку без записи тела. При отличии сервис сравнения формирует ограниченный diff, сохраняет сжатый snapshot в объектное хранилище, а указатели и hashes — в шардированной мета-БД. Условная запись по версии предотвращает гонку двух проверок одного URL. Событие изменения и обновление текущей версии фиксируются через transactional outbox; webhook-воркеры доставляют событие at-least-once со стабильным event_id, backoff и dead-letter очередью.

    Шардинг планировщика по hash URL и разбиение ближайшего времени на бакеты позволяют держать пик. Backpressure увеличивает допустимую задержку низкоприоритетных подписок, но не нарушает host limits; двухминутный SLO применяется только к принятым расписаниям, обеспеченным host-бюджетом. При 429 частота конкретного host снижается, при сбое рендерера задания возвращаются с ограничением попыток, а старый snapshot остаётся текущим. Webhook подписывается секретом подписки, имеет жёсткие connect/response timeout и предел ответа. Метрики охватывают schedule lag, очередь по host, 429, latency загрузки, долю изменений, размер diff, загрузку браузеров и webhook success. Алерты реагируют на двухминутный lag и необычный скачок изменений, который часто означает поломку нормализатора.
  tradeoffs:
    - "Периодический polling vs push от владельца: polling универсален, но создаёт неизбежный лишний трафик."
    - "DOM-нормализация vs побайтовый hash: нормализация уменьшает шум ценой CPU и риска скрыть реальное изменение."
    - "Полные snapshots vs цепочка diff: snapshots дороже, зато чтение и восстановление не зависят от длинной истории."
    - "Единая очередь vs per-host очереди: единая проще, разбиение по host обеспечивает справедливость и politeness."
    - "Headless по умолчанию vs по признаку: полный рендеринг точнее для SPA, но резко дороже."
  diagram: diagrams/change-detection-crawler.gold.drawio
rubric_overrides:
  - "Оценивать разделение обычных HTTP-загрузчиков и ограниченного пула headless-браузеров."
  - "Решение должно предотвращать параллельное обновление одной версии URL."
  - "Уведомление должно следовать из transactional outbox или эквивалентной атомарной схемы."
  - "Нужен контроль общего per-host лимита между воркерами."
